<style>
  :root{
    --bg:#000000;
    --fg:#D8D8D2;
    --fg-dim:#7A7A73;
    --dir:#8FA88A;
    --media:#C97B52;
    --err:#C97B52;
    --line:#262622;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:15px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
  ::selection{ background:var(--fg); color:var(--bg); }
  :focus-visible{ outline:1px solid var(--fg); outline-offset:2px; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  .app-shell{
    height:100vh;
    height:100svh;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }

  .term{
    height:100vh;
    height:100svh;
    display:flex;
    flex-direction:column;
    max-width:840px;
    width:100%;
    flex:none;
    padding:0 20px;
    transition:max-width 0.45s cubic-bezier(.4,0,.2,1);
  }
  .app-shell.gallery-open .term,
  .app-shell.video-gallery-open .term{
    max-width:50vw;
  }

  .gallery-pane{
    flex:none;
    width:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
    transition:width 0.45s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
  }
  .app-shell.gallery-open .gallery-pane{
    width:50vw;
    border-left:1px solid var(--line);
  }
  .video-gallery-pane{
    flex:none;
    width:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
    transition:width 0.45s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
  }
  .app-shell.video-gallery-open .video-gallery-pane{
    width:50vw;
    border-right:1px solid var(--line);
  }
  .galleryhead{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    color:var(--fg-dim);
    border-bottom:1px solid var(--line);
    padding:16px 18px 10px;
    white-space:nowrap;
  }
  .gallerybody{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 18px;
    min-width:340px;
  }
  .gallery-jump-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
  }
  .gallery-jump{
    display:block;
    width:100%;
    text-align:left;
    color:var(--fg-dim);
    border:1px solid var(--line);
    padding:6px 10px;
    background:none;
  }
  .gallery-jump:hover, .gallery-jump:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .gallery-section-title{
    color:var(--dir);
    margin:18px 0 8px;
  }
  .gallery-section-title:first-child{ margin-top:0; }
  .gallery-grid{
    columns:2;
    column-gap:12px;
  }
  .gallery-thumb{
    display:block;
    width:100%;
    margin:0 0 12px;
    break-inside:avoid;
    border:1px solid var(--line);
    background:none;
    padding:0;
    overflow:hidden;
    opacity:0;
    animation:thumbIn 0.35s ease forwards;
  }
  .gallery-thumb:hover, .gallery-thumb:focus-visible{ border-color:var(--fg-dim); }
  .gallery-thumb img{
    width:100%; height:auto; display:block;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  @keyframes thumbIn{ to{ opacity:1; } }
  img.blur-up{ opacity:0; transition:opacity 0.35s ease; }
  img.blur-up.is-loaded{ opacity:1; }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:40px;
  }
  .lightbox.open{ display:flex; }
  .lightbox-content{
    display:flex;
    align-items:center;
    gap:24px;
    max-width:1100px;
    max-height:100%;
    width:auto;
  }
  .lightbox-image-wrap{
    flex:0 1 auto;
    display:inline-flex;
    max-width:100%;
    max-height:80vh;
    overflow:hidden;
    border:1px solid var(--line);
    cursor:zoom-in;
  }
  .lightbox-image{
    flex:none;
    max-width:100%;
    max-height:80vh;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    transition:transform 0.15s ease;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  .lightbox-image.zoomed{ transition:none; }
  .lightbox-info{
    flex:none;
    width:240px;
    color:var(--fg-dim);
    padding-top:4px;
  }
  .lightbox-filename{ color:var(--fg); margin-bottom:10px; word-break:break-word; }
  .lightbox-camera{ margin-bottom:4px; }
  .lightbox-lens{ margin-bottom:4px; }
  .lightbox-film{ margin-bottom:4px; }
  .lightbox-format{ margin-bottom:14px; }
  .lightbox-artist{ margin-bottom:4px; }
  .lightbox-medium{ margin-bottom:14px; }
  .lightbox-desc{ line-height:1.6; }
  .lightbox-close, .lightbox-arrow{
    position:fixed;
    border:1px solid var(--line);
    color:var(--fg-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.4);
  }
  .lightbox-close:hover, .lightbox-arrow:hover,
  .lightbox-close:focus-visible, .lightbox-arrow:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .lightbox-close{ top:20px; right:20px; width:32px; height:32px; font-size:1.1rem; }
  .lightbox-arrow{ top:50%; transform:translateY(-50%); width:44px; height:44px; font-size:1.4rem; }
  .lightbox-prev{ left:20px; }
  .lightbox-next{ right:20px; }

  @media (max-width: 760px){
    .app-shell.gallery-open .term,
    .app-shell.video-gallery-open .term{ display:none; }
    .app-shell.gallery-open .gallery-pane,
    .app-shell.video-gallery-open .video-gallery-pane{ width:100vw; border:none; }
    .gallerybody{ min-width:0; padding:14px 14px calc(24px + env(safe-area-inset-bottom)); }
    .galleryhead{ padding:calc(12px + env(safe-area-inset-top)) 14px 10px; }
    .gallery-grid, .video-list{ column-gap:8px; }
    .gallery-thumb, .video-card{ margin-bottom:8px; }

    .lightbox{
      padding:calc(64px + env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
      align-items:flex-start;
      overflow-y:auto;
      background:#000;
    }
    .lightbox-content{ flex-direction:column; align-items:stretch; gap:14px; width:100%; max-height:none; }
    .lightbox-image-wrap{ max-height:62svh; width:100%; justify-content:center; cursor:default; border:none; }
    .lightbox-image{ max-height:62svh; margin:0 auto; }
    .lightbox-info{ width:100%; padding-top:0; }
    .lightbox-close{ top:calc(12px + env(safe-area-inset-top)); right:12px; width:44px; height:44px; font-size:1.3rem; }
    .lightbox-arrow{
      top:auto; transform:none;
      bottom:calc(16px + env(safe-area-inset-bottom));
      width:64px; height:48px;
    }
    .lightbox-prev{ left:14px; }
    .lightbox-next{ right:14px; }
  }

  .video-list{
    columns:2;
    column-gap:12px;
  }
  .video-card{
    display:block;
    width:100%;
    margin:0 0 12px;
    break-inside:avoid;
    border:1px solid var(--line);
    padding:0;
    overflow:hidden;
    opacity:0;
    animation:thumbIn 0.35s ease forwards;
  }
  .video-thumb{
    display:block;
    width:100%;
    position:relative;
    border:none;
    background:none;
    padding:0;
    overflow:hidden;
  }
  .video-thumb img{
    width:100%; height:auto; display:block;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  .video-thumb::after{
    content:'▶';
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(0,0,0,0.55);
    border:1px solid var(--fg-dim);
    color:var(--fg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.8rem;
    pointer-events:none;
  }
  .video-thumb:hover::after, .video-thumb:focus-visible::after{
    border-color:var(--fg);
  }
  .video-meta{
    padding:8px 10px 12px;
  }
  .video-title{
    color:var(--fg);
    margin-bottom:4px;
  }
  .video-desc{
    color:var(--fg-dim);
    line-height:1.6;
  }

  .about-header-text{ margin:0 0 1.65em; }
  .about-gif-pin{
    float:right;
    width:128px;
    height:auto;
    margin:0 0 14px 18px;
    border:1px solid var(--line);
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
  }
  @media (max-width: 760px){
    .about-gif-pin{ width:29%; max-width:115px; }
  }

  .tie-accent{
    color:var(--dir);
    cursor:pointer;
    text-decoration:underline dotted;
    text-underline-offset:3px;
  }
  .tie-accent:hover{
    filter:brightness(1.2);
  }

  .boot-intro-row{
    position:relative;
  }
  .boot-intro-text{
    min-width:0;
    padding-right:114px;
  }
  .boot-logo{
    display:block;
    position:absolute;
    top:50%;
    right:0;
    transform:translateY(-50%);
    height:72px;
    width:auto;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
  }

  .topbar{
    flex:none;
    padding:16px 0 10px;
    color:var(--fg-dim);
    font-size:0.82rem;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .handle-link{ cursor:pointer; }
  .handle-link:hover, .handle-link:focus-visible{
    color:var(--fg);
    text-decoration:underline;
  }

  .output{
    flex:1 1 auto;
    overflow-y:auto;
    padding:18px 0;
    padding-bottom:calc(18px + var(--room, 0px));
  }

  /* minimal scrollbars that only show while scrolling */
  .output, .gallerybody, .about-float, .lightbox{
    scrollbar-width:thin;
    scrollbar-color:transparent transparent;
  }
  .output.is-scrolling, .gallerybody.is-scrolling, .about-float.is-scrolling, .lightbox.is-scrolling{
    scrollbar-color:var(--fg-dim) transparent;
  }
  .output::-webkit-scrollbar, .gallerybody::-webkit-scrollbar,
  .about-float::-webkit-scrollbar, .lightbox::-webkit-scrollbar{ width:5px; height:5px; }
  .output::-webkit-scrollbar-track, .gallerybody::-webkit-scrollbar-track,
  .about-float::-webkit-scrollbar-track, .lightbox::-webkit-scrollbar-track{ background:transparent; }
  .output::-webkit-scrollbar-thumb, .gallerybody::-webkit-scrollbar-thumb,
  .about-float::-webkit-scrollbar-thumb, .lightbox::-webkit-scrollbar-thumb{ background:transparent; border-radius:3px; }
  .output.is-scrolling::-webkit-scrollbar-thumb, .gallerybody.is-scrolling::-webkit-scrollbar-thumb,
  .about-float.is-scrolling::-webkit-scrollbar-thumb, .lightbox.is-scrolling::-webkit-scrollbar-thumb{ background:var(--fg-dim); }
  .output::-webkit-scrollbar-button, .gallerybody::-webkit-scrollbar-button{ display:none; }

  .line{
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:2px;
  }
  .line.echo{ margin-top:14px; color:var(--fg); }
  .line.echo .prompt{ color:var(--dir); }
  .line.err{ color:var(--err); }
  .line.dim{ color:var(--fg-dim); }
  .quote-line{ margin-bottom:4.95em; }

  .revive-overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    z-index:200;
  }
  .revive-overlay .line{ font-size:1.05rem; margin-bottom:0; position:relative; z-index:1; transition:opacity 1s ease; }
  .revive-gif{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    max-width:min(70vw,340px);
    max-height:min(70vh,340px);
    width:auto; height:auto;
    opacity:0;
    transition:opacity 1s ease;
    pointer-events:none;
    z-index:0;
  }

  .panel{ margin:10px 0 16px; }
  .panelhead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    color:var(--fg-dim);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .panelhead .panelname{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panelhead-actions{ flex:none; display:flex; align-items:center; gap:6px; }
  .closebtn, .backbtn{
    flex:none;
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    color:var(--fg-dim);
    line-height:1;
    font-size:0.85rem;
  }
  .closebtn:hover, .closebtn:focus-visible,
  .backbtn:hover, .backbtn:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .panelbody pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-family:inherit;
    font-size:inherit;
  }

  .album-view{
    display:flex;
    gap:20px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .album-cover-link{ flex:none; display:block; }
  .album-cover{
    width:160px;
    height:160px;
    object-fit:cover;
    border:1px solid var(--line);
    display:block;
  }
  .album-meta{
    flex:1;
    min-width:180px;
    padding-top:2px;
  }
  .album-title{
    color:var(--fg);
    font-size:1rem;
    margin-bottom:4px;
  }
  .album-artist{ color:var(--fg-dim); margin-bottom:10px; }
  .album-sub{ color:var(--fg-dim); font-size:0.85em; margin-bottom:14px; }
  .album-link{
    color:var(--dir);
    text-decoration:underline;
  }
  .album-link:hover, .album-link:focus-visible{ color:var(--fg); }
  .album-links{ display:flex; flex-wrap:wrap; gap:6px 16px; }

  .album-facts{ color:var(--fg-dim); font-size:0.85em; margin-bottom:4px; }
  .album-facts b{ color:var(--fg); font-weight:500; }

  .row-thumb{
    width:1.1em;
    height:1.1em;
    object-fit:cover;
    border:1px solid var(--line);
    vertical-align:-0.18em;
    margin-right:8px;
    flex:none;
  }
  .cover-fallback{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    line-height:1;
  }
  .row-thumb.cover-fallback{ font-size:0.55em; }
  .album-cover.cover-fallback{ font-size:2.2rem; }

  .row-icon{
    display:inline-block;
    width:1.3em;
    flex:none;
    text-align:center;
    color:var(--fg-dim);
    margin-right:6px;
  }

  .listing{ display:flex; flex-direction:column; gap:2px; margin:4px 0 8px; }
  .listing button{
    text-align:left;
    color:var(--fg);
    padding:1px 0;
  }
  .listing button:hover, .listing button:focus-visible{ color:var(--fg); text-decoration:underline; }
  .listing .tag-dir{ color:var(--dir); }
  .listing .tag-media{ color:var(--media); }
  .listing .kind{ color:var(--fg-dim); margin-left:10px; font-size:0.85em; }

  .help-group{
    color:var(--fg-dim);
    font-size:0.8rem;
    margin:14px 0 4px;
  }
  .help-group:first-child{ margin-top:0; }

  .shortcuts{ display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; }
  .help-hint{ margin-top:14px; }
  .shortcuts button{ color:var(--fg-dim); }
  .shortcuts button:hover, .shortcuts button:focus-visible{ color:var(--fg); text-decoration:underline; }

  .inputrow.gone{ display:none; }
  .inputrow{
    flex:none;
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:12px 0 18px;
    border-top:1px solid var(--line);
  }
  .promptlabel{ color:var(--dir); white-space:pre; padding-top:2px; }
  .inputrow input{
    flex:1;
    background:none;
    border:none;
    color:var(--fg);
    font:inherit;
    padding-top:2px;
  }
  .inputrow input:focus{ outline:none; }

  @media (max-width:600px){
    .term{ padding:0 14px; }
    body{ font-size:14px; }
  }

  .flash{
    position:fixed; inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:50;
  }
  .flash.on{ animation:shutter 160ms ease-out; }
  @keyframes shutter{
    0%{ opacity:0; }
    18%{ opacity:1; }
    100%{ opacity:0; }
  }

  .boot-flicker{
    animation-name:flicker;
    animation-timing-function:linear;
    animation-fill-mode:both;
    animation-iteration-count:1;
  }
  @keyframes flicker{
    0%{ opacity:0; }
    4%{ opacity:1; }
    8%{ opacity:0.15; }
    12%{ opacity:1; }
    18%{ opacity:0.08; }
    24%{ opacity:1; }
    30%{ opacity:0.3; }
    38%{ opacity:1; }
    46%{ opacity:0.12; }
    54%{ opacity:1; }
    64%{ opacity:0.4; }
    72%{ opacity:1; }
    100%{ opacity:1; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .noscript-card{ max-width:640px; margin:0 auto; padding:40px 20px; line-height:1.7; }
  .noscript-card p{ margin-bottom:14px; }
  .noscript-card a{ color:var(--fg); }

  /* ---- contact: links + compose ---- */
  .contact-link{ color:var(--dir); text-decoration:underline; text-underline-offset:3px; }
  .contact-link:hover, .contact-link:focus-visible{ color:var(--fg); }

  .compose{
    margin-top:20px;
    padding-top:14px;
    border-top:1px dashed var(--line);
    max-width:600px;
  }
  .compose-title{ color:var(--fg-dim); margin-bottom:12px; }
  .compose-row{
    display:grid;
    grid-template-columns:80px 1fr;
    gap:10px;
    align-items:baseline;
    margin-bottom:10px;
  }
  .compose-row > .compose-label{ color:var(--fg-dim); }

  function buildPhotoFiles(entries, mode){
    const files = {};
    entries.forEach(([id, filename], i) => {
      const filmInfo = mode === 'film' ? FILM_DETAILS[filename] : null;
      const digitalInfo = mode === 'digital' ? DIGITAL_DETAILS[filename] : null;
      const stillsInfo = mode === 'stills' ? STILLS_DETAILS[filename] : null;
      let camera = '', lens = '', film = '', format = '', description = '';
      if(mode === 'film'){
        camera = filmInfo ? filmInfo.camera : '';
        lens = filmInfo ? filmInfo.lens : '';
        film = (filmInfo && filmInfo.film) ? filmInfo.film : filmStockFromName(filename);
        format = (filmInfo && filmInfo.format) ? filmInfo.format : FILM_FORMAT;
        description = filmInfo ? filmInfo.description : '';
      } else if(mode === 'digital'){
        camera = digitalInfo ? digitalInfo.camera : DIGITAL_CAMERA;
        lens = digitalInfo ? digitalInfo.lens : DIGITAL_LENS;
        description = digitalInfo ? digitalInfo.description : (DIGITAL_DESCRIPTIONS[filename] || '');
      } else if(mode === 'stills'){
        camera = stillsInfo ? stillsInfo.camera : '';
        lens = stillsInfo ? stillsInfo.lens : '';
        description = stillsInfo ? stillsInfo.description : '';
      }
      files['p' + String(i).padStart(3, '0') + '.photo'] = {
        type:'photo',
        filename: (filmInfo && filmInfo.displayName) ? filmInfo.displayName : filename,
        camera: camera,
        lens: lens,
        film: film,
        format: format,
        description: description,
        src: driveThumb(id, 1600),
      };
    });
    return files;
  }

  function buildVideoFiles(entries){
    const files = {};
    entries.forEach((v, i) => {
      // If a custom thumbnail lives in Drive (v.driveThumbId), prefer it — falls back
      // to the YouTube-generated thumbnail (and its own hqdefault fallback) otherwise.
      files['v' + String(i).padStart(3, '0') + '.video'] = {
        type:'video',
        videoId: v.id,
        filename: v.title,
        title: v.title,
        description: v.description || '',
        date: v.date || '',
        pinned: !!v.pinned,
        category: v.category || '',
        thumb: v.driveThumbId ? driveThumb(v.driveThumbId, 640) : youtubeThumb(v.id),
        thumbFallback: v.driveThumbId ? youtubeThumb(v.id) : youtubeThumbFallback(v.id),
      };
    });
    return files;
  }

  function splitPath(p){ return p.split('/').filter(Boolean); }

  function resolveNode(pathStr){
    const parts = splitPath(pathStr);
    let node = { type:'dir', files: FS };
    for(const part of parts){
      if(!node || node.type !== 'dir' || !node.files || !node.files[part]) return null;
      node = node.files[part];
    }
    return node;
  }

  function resolveDirNode(pathStr){
    const node = pathStr === '' ? { type:'dir', files: FS } : resolveNode(pathStr);
    return (node && node.type === 'dir') ? node : null;
  }

  function resolveArgPath(arg){
    if(!arg) return cwd;
    const trimmed = arg.replace(/\/$/, '');
    if(resolveNode(trimmed)) return trimmed;
    const rel = cwd ? cwd + '/' + trimmed : trimmed;
    if(resolveNode(rel)) return rel;
    return trimmed;
  }

  // Opens an outside link in a new tab. A real <a target=_blank> click is honoured by
  // mobile Safari/Chrome and most in-app browsers more reliably than window.open().
  function openExternal(url){
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();

  function scrollBottom(){
    if(centerRoom) setCenterRoom(0);
    output.scrollTop = output.scrollHeight;
  }
  // On a phone a tall panel scrolled to the bottom hides its own beginning,
  // so bring the panel's top into view instead.
  function smoothScrollOutput(top){
    output.scrollTo({ top: Math.max(0, top), behavior: REDUCED_MOTION ? 'auto' : 'smooth' });
  }
  let panelScrollWatch = null;
  function scrollToPanel(panel){
    if(panelScrollWatch){ panelScrollWatch.stop(); panelScrollWatch = null; }
    const aim = () => {
      if(!panel.isConnected) return;
      const oRect = output.getBoundingClientRect();
      const pRect = panel.getBoundingClientRect();
      const viewH = output.clientHeight;
      const panelTop = pRect.top - oRect.top + output.scrollTop;
      let top;
      if(pRect.height >= viewH - 24){
        // too tall to centre: show its beginning (starting from the command that opened it)
        const echo = panel.previousElementSibling;
        const anchor = (echo && echo.classList.contains('entry')) ? echo : panel;
        top = anchor.getBoundingClientRect().top - oRect.top + output.scrollTop - 6;
      } else {
        top = panelTop + pRect.height / 2 - viewH / 2;
      }
      top = Math.max(0, top);
      // make sure the page is long enough to scroll that far
      const natural = output.scrollHeight - centerRoom;
      const need = Math.max(0, Math.ceil(top + viewH - natural));
      if(need !== centerRoom) setCenterRoom(need);
      smoothScrollOutput(top);
    };
    // wait a frame so the panel's content exists and the output can scroll that far
    requestAnimationFrame(aim);

    // content (thumbnails, images) can still be growing for a moment after the panel
    // opens; re-aim while it settles so the panel never ends up off screen.
    if(typeof ResizeObserver === 'undefined') return;
    let done = false;
    const ro = new ResizeObserver(() => { if(!done) aim(); });
    ro.observe(panel);
    const stop = () => {
      if(done) return;
      done = true;
      ro.disconnect();
      clearTimeout(timer);
      ['wheel', 'touchstart', 'keydown'].forEach(t => output.removeEventListener(t, stop));
    };
    const timer = setTimeout(stop, 1500);
    // the person scrolling themselves always wins
    ['wheel', 'touchstart', 'keydown'].forEach(t => output.addEventListener(t, stop, { passive: true }));
    panelScrollWatch = { stop };
  }

    if(currentPanel){

  // Renders contact.txt with its email / handles / youtube turned into links.
  function renderContactText(pre, text){
    const re = /([\w.+-]+@[\w-]+\.[\w.-]+)|(^|\s)(@[\w.]+)|(youtube\.com\/\S+)/gm;
    let last = 0, m;
    while((m = re.exec(text))){
      if(m[1]){
        pre.appendChild(document.createTextNode(text.slice(last, m.index)));
        pre.appendChild(contactLink(m[1], 'mailto:' + m[1], false));
        last = m.index + m[1].length;

        pre.appendChild(document.createTextNode(text.slice(last, start)));
        pre.appendChild(contactLink(m[3], 'https://www.instagram.com/' + m[3].slice(1) + '/', true));

        pre.appendChild(contactLink(m[4], 'https://' + m[4], true));
        last = m.index + m[4].length;

  // each file owns a group of windows: opening it again closes that group only
  function toggleFloatGroup(group, makeSpecs){
    const mine = floatWins.filter(w => w.group === group && w.mode !== 'closing');
    if(mine.length){
      mine.forEach((w, i) => setTimeout(() => closeWin(w, true), i * 120));
      return;
    }
    makeSpecs().forEach((spec, i) => {

  /* ---------- floating windows ---------- */
  const CONTACT_WIN_SPECS = [
    { key:'socials', title:'socials', width:400 },
    { key:'mail', title:'write to me', width:460 },
  ];
  let floatWins = [];
  let floatLayer = null;
  let floatRAF = null;
  let floatLastT = 0;
  let floatZ = 1;
  const TOP_LINE = 'inset(0 0 calc(100% - 1px) 0)';
  const FULL = 'inset(0 0 0 0)';

  function ensureFloatLayer(){
    if(!floatLayer){
      floatLayer = el('div', 'float-layer');
      document.body.appendChild(floatLayer);
    }
    return floatLayer;
  }

  function placeAt(w){ w.el.style.transform = 'translate(' + w.x.toFixed(2) + 'px,' + w.y.toFixed(2) + 'px)'; }

  function anim(elm, frames, opts){
    if(REDUCED_MOTION) return Promise.resolve();
    return elm.animate(frames, Object.assign({ fill:'forwards' }, opts)).finished.catch(() => {});
  }
  function clearAnims(elm){ elm.getAnimations().forEach(a => a.cancel()); }

  function startFloatLoop(){
    if(!floatRAF){
      floatLastT = performance.now();
      floatRAF = requestAnimationFrame(floatTick);
    }
  }

  function removeWin(w){
    w.el.remove();
    floatWins = floatWins.filter(x => x !== w);
  }

  // closing plays the opening backwards: the window rolls up into its top edge, the line retracts
  async function closeWin(w, animate){
    if(w.mode === 'closing') return;
    w.mode = 'closing';
    w.el.classList.remove('dragging');
    if(!animate || REDUCED_MOTION){ removeWin(w); return; }
    clearAnims(w.el);
    w.el.style.clipPath = FULL;
    await anim(w.el, [{ clipPath: FULL }, { clipPath: TOP_LINE }], { duration:360, easing:'cubic-bezier(.6,0,.8,.4)' });
    const seed = el('div', 'float-seed');
    seed.style.transform = 'scaleX(1)';
    w.el.appendChild(seed);
    await anim(seed, [{ transform:'scaleX(1)' }, { transform:'scaleX(0)' }], { duration:260, easing:'cubic-bezier(.6,0,.8,.4)' });
    removeWin(w);
  }

  function closeAllFloatWins(animate){
    floatWins.slice().forEach((w, i) => {
      if(animate) setTimeout(() => closeWin(w, true), i * 120);
      else removeWin(w);
    });
  }

  function createFloatWin(spec, content){
    const win = el('div', 'float-win');
    win.style.width = Math.min(spec.width, window.innerWidth - 40) + 'px';
    win.setAttribute('role', 'dialog');
    win.setAttribute('aria-label', spec.title);
    const bar = el('div', 'float-bar');
    const titleEl = el('span', '', esc(spec.title));
    bar.appendChild(titleEl);
    const x = el('button', 'closebtn', '×');
    x.type = 'button';
    x.setAttribute('aria-label', 'close ' + spec.title);
    bar.appendChild(x);
    const body = el('div', 'float-body');
    body.appendChild(content);
    win.appendChild(bar);
    win.appendChild(body);

    const w = {
      key: spec.key, el: win, bar, body, titleEl,
      mode: 'new', x: 0, y: 0, vx: 0, vy: 0,
      cruise: 22 + Math.random() * 16,
      speedF: 0, hover: false, ignoreHover: false,
      samples: [], offX: 0, offY: 0,
    };
    floatWins.push(w);

    x.addEventListener('click', () => closeWin(w, true));
    win.addEventListener('mouseenter', () => { if(!w.ignoreHover) w.hover = true; });
    win.addEventListener('mouseleave', () => { w.hover = false; w.ignoreHover = false; });
    win.addEventListener('mousedown', () => { win.style.zIndex = ++floatZ; });

    return w;

  // opening: a line draws across at a random spot, then the window unrolls downward from it
  function openWin(w){
    if(w.mode !== 'new') return;
    ensureFloatLayer().appendChild(w.el);
    w.el.style.zIndex = ++floatZ;
    const W = window.innerWidth, H = window.innerHeight;
    w.x = Math.random() * Math.max(0, W - w.el.offsetWidth);
    w.y = Math.random() * Math.max(0, H - w.el.offsetHeight);
    placeAt(w);
    const ang = Math.random() * Math.PI * 2;
    w.vx = Math.cos(ang) * w.cruise;
    w.vy = Math.sin(ang) * w.cruise;
    w.speedF = 0;
    w.mode = 'anim';
    startFloatLoop();
    if(REDUCED_MOTION){ w.mode = 'floating'; return; }
    w.el.style.clipPath = TOP_LINE;
    const seed = el('div', 'float-seed');
    w.el.appendChild(seed);
    anim(seed, [{ transform:'scaleX(0)' }, { transform:'scaleX(1)' }], { duration:380, easing:'cubic-bezier(.4,0,.2,1)' })
      .then(() => {
        if(w.mode !== 'anim') return;
        anim(seed, [{ opacity:1 }, { opacity:0 }], { duration:400 }).then(() => seed.remove());
        decodeText(w.body, 0.05, 0.85);
        scrambleInto(w.titleEl, 0.05, 0.5);
        return anim(w.el, [{ clipPath: TOP_LINE }, { clipPath: FULL }], { duration:620, easing:'cubic-bezier(.2,.7,.2,1)' });
      })
      .then(() => {
        if(w.mode !== 'anim') return;
        clearAnims(w.el);
        w.el.style.clipPath = '';
        w.mode = 'floating';
      });
  }

  /* drag by the title bar; letting go throws the window with the speed it was moving */
  function attachDrag(w){
    const bar = w.bar;
    bar.addEventListener('pointerdown', (e) => {
      if(e.button !== 0 || e.target.closest('.closebtn')) return;
      if(w.mode !== 'floating') return;
      e.preventDefault();
      w.mode = 'drag';
      w.el.classList.add('dragging');
      w.el.style.zIndex = ++floatZ;
      document.body.classList.add('is-dragging');
      w.offX = e.clientX - w.x;
      w.offY = e.clientY - w.y;
      w.samples = [{ t: performance.now(), x: e.clientX, y: e.clientY }];
      try{ bar.setPointerCapture(e.pointerId); }catch(err){}
    });
    bar.addEventListener('pointermove', (e) => {
      if(w.mode !== 'drag') return;
      const W = window.innerWidth, H = window.innerHeight;
      w.x = Math.max(0, Math.min(W - w.el.offsetWidth, e.clientX - w.offX));
      w.y = Math.max(0, Math.min(H - w.el.offsetHeight, e.clientY - w.offY));
      placeAt(w);
      const now = performance.now();
      w.samples.push({ t: now, x: e.clientX, y: e.clientY });
      while(w.samples.length > 2 && now - w.samples[0].t > 90) w.samples.shift();
    });
    const release = () => {
      if(w.mode !== 'drag') return;
      w.el.classList.remove('dragging');
      document.body.classList.remove('is-dragging');
      const now = performance.now();
      const a = w.samples[0], b = w.samples[w.samples.length - 1];
      let vx = 0, vy = 0;
      if(a && b && now - b.t < 70){
        const dt = (b.t - a.t) / 1000;
        if(dt > 0.008){ vx = (b.x - a.x) / dt; vy = (b.y - a.y) / dt; }
      }
      let sp = Math.hypot(vx, vy);
      const MAX = 2600;
      if(sp > MAX){ vx *= MAX / sp; vy *= MAX / sp; sp = MAX; }
      if(sp > w.cruise * 3){
        // thrown: fly off, bounce, and bleed speed back down to a drift
        w.vx = vx; w.vy = vy;
        w.speedF = 1;
        w.hover = false;
        w.ignoreHover = true;
      } else {
        // just placed: rest under the cursor, then resume the old drift
        const cur = Math.hypot(w.vx, w.vy) || 1;
        w.vx = w.vx / cur * w.cruise;
        w.vy = w.vy / cur * w.cruise;
        w.speedF = 0;
      }
      w.mode = 'floating';
      startFloatLoop();
    };
    bar.addEventListener('pointerup', release);
    bar.addEventListener('pointercancel', release);
  }

  // how the pop-outs move: 'drift' (default), 'gravity', 'antigravity', 'magnet'
  let floatPhysics = 'drift';
  let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; }, { passive: true });
  const G = 1400; // px / s^2

  function floatTick(t){
    const dt = Math.min(0.05, (t - floatLastT) / 1000);
    floatLastT = t;
    const W = window.innerWidth, H = window.innerHeight;
    floatWins.forEach(w => {
      if(w.mode !== 'floating') return;
      // hovering (or typing inside) eases the window to a stop; leaving lets it move again
      const holding = (w.hover && !w.ignoreHover) || w.el.contains(document.activeElement);
      const target = holding ? 0 : 1;
      const rate = holding ? 5 : 0.9;
      w.speedF += (target - w.speedF) * Math.min(1, dt * rate);
      if(REDUCED_MOTION) w.speedF = 0;
      const ww = w.el.offsetWidth, hh = w.el.offsetHeight;
      let sp = Math.hypot(w.vx, w.vy);
      let damp = 1;
      if(floatPhysics === 'drift'){
        // a thrown window loses speed until it is back to its lazy cruising pace
        if(sp > w.cruise){
          const ns = Math.max(w.cruise, sp * Math.exp(-0.85 * dt));
          w.vx *= ns / sp; w.vy *= ns / sp; sp = ns;
        } else if(sp < w.cruise * 0.5){
          const ang = Math.random() * Math.PI * 2;
          w.vx = Math.cos(ang) * w.cruise; w.vy = Math.sin(ang) * w.cruise;
        }
        damp = sp > w.cruise * 1.5 ? 0.82 : 1;
      } else if(floatPhysics === 'gravity' || floatPhysics === 'antigravity'){
        if(w.speedF > 0.05) w.vy += (floatPhysics === 'gravity' ? G : -G) * dt;
        const floor = floatPhysics === 'gravity' ? (w.y + hh >= H - 0.5) : (w.y <= 0.5);
        if(floor){ w.vx *= Math.exp(-2.5 * dt); }
        damp = 0.58;
      } else if(floatPhysics === 'magnet'){
        const dx = mouseX - (w.x + ww / 2), dy = mouseY - (w.y + hh / 2);
        const d = Math.hypot(dx, dy) || 1;
        w.vx += dx / d * 900 * dt;
        w.vy += dy / d * 900 * dt;
        w.vx *= Math.exp(-1.2 * dt); w.vy *= Math.exp(-1.2 * dt);
        damp = 0.7;
      }
      w.x += w.vx * w.speedF * dt;
      w.y += w.vy * w.speedF * dt;
      if(ww >= W){ w.x = 0; }
      else if(w.x < 0){ w.x = 0; w.vx = Math.abs(w.vx) * damp; }
      else if(w.x + ww > W){ w.x = W - ww; w.vx = -Math.abs(w.vx) * damp; }
      if(hh >= H){ w.y = 0; }
      else if(w.y < 0){ w.y = 0; w.vy = Math.abs(w.vy) * damp; if(Math.abs(w.vy) < 60 && floatPhysics === 'antigravity') w.vy = 0; }
      else if(w.y + hh > H){ w.y = H - hh; w.vy = -Math.abs(w.vy) * damp; if(Math.abs(w.vy) < 60 && floatPhysics === 'gravity') w.vy = 0; }
      placeAt(w);
    });
    floatRAF = floatWins.length ? requestAnimationFrame(floatTick) : null;
  }

  /* ---------- decode: scramble every text node in place (keeps links/spans intact) ---------- */
  function scrambleTextNode(node, delaySec, durSec){
    const finalText = node.nodeValue;
    const len = finalText.length;
    if(!len) return;
    node.nodeValue = '';
    const start = performance.now() + delaySec * 1000;
    const totalMs = Math.max(durSec * 1000, 1);
    const perCharMs = totalMs / len;
    function frame(now){
      if(now < start){ requestAnimationFrame(frame); return; }
      const elapsed = now - start;
      if(elapsed >= totalMs){ node.nodeValue = finalText; return; }
      const settled = Math.floor(elapsed / perCharMs);
      let out = finalText.slice(0, settled);
      const ch = finalText[settled];
      if(ch !== undefined){
        if(ch === ' ' || ch === '\n') out += ch;
        else {
          const within = (elapsed - settled * perCharMs) / perCharMs;
          out += within >= 0.55 ? ch : SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
        }
      }
      node.nodeValue = out;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function decodeText(root, delaySec, durSec){
    if(REDUCED_MOTION) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        if(n.parentNode && n.parentNode.closest && n.parentNode.closest('textarea, script, style')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => scrambleTextNode(n, delaySec, durSec));
  }

  function randomizeAccents(){
    const h1 = Math.floor(Math.random() * 360);
    let h2 = Math.floor(Math.random() * 360);
    if(Math.abs(h1 - h2) < 40) h2 = (h2 + 90) % 360;
    const dir = 'hsl(' + h1 + ', 42%, 62%)';
    const media = 'hsl(' + h2 + ', 55%, 58%)';
    const root = document.documentElement.style;
    root.setProperty('--dir', dir);

    root.setProperty('--err', media);
  }

  function hashHue(str){
    let h = 0;
    for(let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) % 360; }
    return h < 0 ? h + 360 : h;
  }

  function initialsFor(name){
    const words = name.replace(/[().,]/g, '').split(/\s+/).filter(Boolean);
    if(words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function swapToCoverFallback(imgEl, seedText){
    const hue = hashHue(seedText);
    const ph = document.createElement('span');
    ph.className = imgEl.className + ' cover-fallback';

    ph.style.color = 'hsl(' + hue + ', 42%, 74%)';
    ph.textContent = initialsFor(seedText);
    ph.setAttribute('aria-hidden', 'true');
    if(imgEl.parentNode) imgEl.replaceWith(ph);
  }

  function shuffled(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

        img.removeEventListener('error', onThumbErr);
        if(video.thumbFallback && img.src !== video.thumbFallback) img.src = video.thumbFallback;
      }, { once: true });
      img.addEventListener('load', function onThumbLoad(){
        img.removeEventListener('load', onThumbLoad);
        // maxresdefault silently serves a tiny 120x90 grey placeholder (HTTP 200, no
        // error event) when a real HD thumbnail doesn't exist for a video — swap down.
        if(img.naturalWidth && img.naturalWidth <= 120 && video.thumbFallback && img.src !== video.thumbFallback){
          img.src = video.thumbFallback;
        }
      });
      img.src = video.thumb;
      thumb.appendChild(img);
      thumb.addEventListener('click', () => openVideoLink(video));

      const parts = splitPath(cwd);
      parts.pop();
      cwd = parts.join('/');

  function doCat(arg){
    if(!arg){ printLine('usage: cat <file>', 'err'); return; }
    const trimmed = arg.replace(/\/$/, '');
    let path = resolveArgPath(trimmed);
    let node = resolveNode(path);

    if(!node && !trimmed.includes('/')){
      for(const d of ['work', 'journal', 'journal/dreams']){
        const dirNode = resolveDirNode(d);
        if(dirNode && dirNode.files[trimmed]){
          node = dirNode.files[trimmed];
          path = d + '/' + trimmed;
          break;
        }
      }
    }

    if(node && node.type === 'album'){
      printAlbumFile(node, 'cat ' + path);
    } else if(node && node.type === 'link'){
      openLinkFile(node);
    } else if(node && node.type === 'video'){
      openVideoLink(node);
    } else if(node && node.type === 'about'){
      printAboutFile(node, 'cat ' + path);
    } else if(path === 'contact.txt' && node){
      printContactFile(node, 'cat ' + path);
    } else if(path === 'work/equipment.txt' && node && !isNarrow()){
      toggleFloatGroup('equipment', () => [{ key:'equipment', title:'equipment.txt', width:470, content: el('pre', '', esc(node.content)) }]);
    } else if(node && node.type !== 'dir'){
      const name = splitPath(path).pop();
      printFile(name, node.content, 'cat ' + path);
    } else {
      printLine('no such file: ' + arg, 'err');
    }
  }

  /* ---------- page transition around games ---------- */
  let pageSaved = null;
  let pageBusy = false;
  function pageTextNodes(){
    const roots = [document.querySelector('.app-shell'), floatLayer].filter(Boolean);
    const out = [];
    roots.forEach(r => {
      const w = document.createTreeWalker(r, NodeFilter.SHOW_TEXT, {
        acceptNode(n){ return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
      });
      while(w.nextNode()) out.push(w.currentNode);
    });
    return out;
  }
  // every piece of text un-types itself into noise, images and borders fade, then the game takes over
  function pageOut(cb){
    pageBusy = true;
    input.blur();
    const nodes = pageTextNodes().map(n => ({ n, text: n.nodeValue }));
    pageSaved = nodes;
    document.body.classList.add('page-decoding-out');
    if(REDUCED_MOTION){ document.body.classList.add('page-away'); pageBusy = false; cb(); return; }
    const start = performance.now(), dur = 700;
    function f(now){
      const p = Math.min(1, (now - start) / dur);
      nodes.forEach(o => {
        const len = o.text.length;
        const keep = Math.floor(len * (1 - p) * (0.6 + 0.4 * ((o.text.charCodeAt(0) % 7) / 7)));
        let str = o.text.slice(0, keep);
        if(p < 1){
          const tail = Math.min(4, len - keep);
          for(let i = 0; i < tail; i++) str += SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
        }
        o.n.nodeValue = str;
      });
      if(p < 1) requestAnimationFrame(f);
      else { document.body.classList.add('page-away'); pageBusy = false; cb(); }
    }
    requestAnimationFrame(f);
  }
  function pageIn(){
    document.body.classList.remove('page-away');
    requestAnimationFrame(() => document.body.classList.remove('page-decoding-out'));
    if(!pageSaved) return;
    pageSaved.forEach(o => {
      if(!o.n.isConnected) return;
      o.n.nodeValue = o.text;
      if(!REDUCED_MOTION) scrambleTextNode(o.n, Math.random() * 0.2, 0.55 + Math.random() * 0.3);
    });
    pageSaved = null;
  }
  function launchGame(fn){

  function sizeCanvas(canvas, w, h){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);

  const KEY_DIRS = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0],
  };
  function bindControls(layer, onDir, onQuit){
    const kd = (e) => {
      if(e.key === 'Escape'){ e.preventDefault(); onQuit(); return; }
      const d = KEY_DIRS[e.key];
      if(d){ e.preventDefault(); e.stopPropagation(); onDir(d[0], d[1]); }
    };
    window.addEventListener('keydown', kd, true);
    let sx = null, sy = null;
    const ts = (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
    const te = (e) => {
      if(sx === null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      sx = null;
      if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if(Math.abs(dx) > Math.abs(dy)) onDir(dx > 0 ? 1 : -1, 0); else onDir(0, dy > 0 ? 1 : -1);
    };
    const tm = (e) => e.preventDefault();
    layer.addEventListener('touchstart', ts, { passive: true });
    layer.addEventListener('touchend', te, { passive: true });
    layer.addEventListener('touchmove', tm, { passive: false });
    return () => window.removeEventListener('keydown', kd, true);
  }

  /* ---------- serpent: snake, eating the logo ---------- */
  const SNAKE_WORD = 'ELIJAHHALFORD';
  function startSerpent(){
    if(activeGame) return;
    const shell = gameShell('serpent', isNarrow() ? 'swipe to steer · eat the logo' : 'arrows / wasd to steer · eat the logo · esc to quit');
    const W = window.innerWidth, H = window.innerHeight;
    const cell = isNarrow() ? 18 : 22;
    const cols = Math.max(12, Math.floor((W - 32) / cell));
    const rows = Math.max(12, Math.floor((H - 130) / cell));
    sizeCanvas(shell.canvas, cols * cell, rows * cell);
    shell.hud.style.width = shell.canvas.style.width;
    const ctx = shell.ctx;
    const apple = document.createElement('img');
    apple.src = LOGO_GIF_DATA_URI;
    apple.className = 'game-sprite';
    apple.style.width = apple.style.height = Math.round(cell * 1.5) + 'px';
    shell.stage.appendChild(apple);

    const mid = Math.floor(rows / 2);
    let snake = [{x:5,y:mid},{x:4,y:mid},{x:3,y:mid},{x:2,y:mid}];
    let dir = [1,0];
    const queue = [];
    let food = null, eaten = 0, step = 110, alive = true;
    const colFg = cssVar('--fg'), colHead = cssVar('--dir'), colLine = cssVar('--line'), colDim = cssVar('--fg-dim');

    function placeFood(){
      do { food = { x: rint(1, cols - 2), y: rint(1, rows - 2) }; }
      while(snake.some(s => s.x === food.x && s.y === food.y));
      apple.style.left = (food.x * cell + cell / 2) + 'px';
      apple.style.top = (food.y * cell + cell / 2) + 'px';
    }
    function draw(){
      ctx.clearRect(0, 0, cols * cell, rows * cell);
      ctx.strokeStyle = colLine; ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, cols * cell - 1, rows * cell - 1);
      ctx.font = '700 ' + Math.round(cell * 0.78) + "px 'JetBrains Mono', monospace";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? colHead : (i % 2 ? colFg : colDim);
        ctx.fillText(SNAKE_WORD[i % SNAKE_WORD.length], s.x * cell + cell / 2, s.y * cell + cell / 2 + 1);
      });
      shell.score.textContent = 'logos eaten: ' + eaten;
    }
    function tick(){
      if(!alive) return;
      if(queue.length) dir = queue.shift();
      const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
      if(head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)){
        alive = false;
        shell.msg.textContent = 'game over · ' + eaten + ' logo' + (eaten === 1 ? '' : 's');
        shell.layer.classList.add('dead');
        setTimeout(() => endGame(shell, unbind, 'the serpent ate ' + eaten + ' logo' + (eaten === 1 ? '' : 's') + ' before it bit itself.'), 1400);
        return;
      }
      snake.unshift(head);
      if(head.x === food.x && head.y === food.y){
        eaten++;
        placeFood();
        step = Math.max(55, step - 4);
        clearInterval(activeGame.timer);
        activeGame.timer = setInterval(tick, step);
      } else snake.pop();
      draw();
    }
    const unbind = bindControls(shell.layer, (dx, dy) => {
      const last = queue.length ? queue[queue.length - 1] : dir;
      if(dx === -last[0] && dy === -last[1]) return;
      if(dx === last[0] && dy === last[1]) return;
      if(queue.length < 3) queue.push([dx, dy]);
    }, () => { alive = false; endGame(shell, unbind, 'serpent quit.'); });
    activeGame = { timer: null };
    placeFood();
    draw();
    shell.msg.textContent = 'ready';
    setTimeout(() => { if(!alive) return; shell.msg.textContent = ''; activeGame.timer = setInterval(tick, step); }, 700);
  }

  // the classic board's middle 19 columns repeat sideways until the maze fills the screen
  function buildWideMaze(copies){
    const houseCopy = Math.floor(copies / 2);
    return MAZE.map(row => {
      let mid = '';
      for(let i = 0; i < copies; i++){
        let part = row.slice(1, 20);
        if(i !== houseCopy) part = part.replace(/G/g, ' ').replace(/-/g, '#').replace(/P/g, '.');
        mid += part;
      }
      return row[0] + mid + row[20];
    });
  }
  function startGhost(){
    if(activeGame) return;
    const shell = gameShell('ghost', isNarrow() ? 'swipe to steer · eat every dot' : 'arrows / wasd · eat every dot · power dots turn the tables · esc to quit');
    const W = window.innerWidth, H = window.innerHeight;
    const rowsN = MAZE.length;
    const fitCell = Math.max(12, Math.min(34, Math.floor((H - 130) / rowsN)));
    const copies = Math.max(1, Math.floor(((W - 32) / fitCell - 2) / 19));
    const BOARD = buildWideMaze(copies);
    const R = BOARD.length, C = BOARD[0].length;
    const cell = Math.max(12, Math.min(fitCell, Math.floor((W - 32) / C)));
    const WALL_WORD = shuffled(WALL_WORDS).join('');
    sizeCanvas(shell.canvas, C * cell, R * cell);
    shell.hud.style.width = shell.canvas.style.width;
    const ctx = shell.ctx;
    const colFg = cssVar('--fg'), colDim = cssVar('--fg-dim'), colLine = cssVar('--line'), colMedia = cssVar('--media');
    const GHOST_COLS = [cssVar('--err'), '#f48fd1', '#5fd6e8', '#f2a65a'];

    const walls = [], dots = new Set(), power = new Set();
    let start = null, house = [], doorCell = null;
    for(let y = 0; y < R; y++){
      walls.push([]);
      for(let x = 0; x < C; x++){
        const ch = BOARD[y][x];
        walls[y][x] = ch === '#';
        if(ch === '.') dots.add(x + ',' + y);
        if(ch === 'o') power.add(x + ',' + y);
        if(ch === 'P') start = { x, y };
        if(ch === 'G') house.push({ x, y });
        if(ch === '-') doorCell = { x, y };
      }
    }
    const exitCell = { x: doorCell.x, y: doorCell.y - 1 };
    const tunnelRow = 9;
    const isDoor = (x, y) => x === doorCell.x && y === doorCell.y;
    function open(x, y, ghost){
      if(y === tunnelRow && (x < 0 || x >= C)) return true;
      if(x < 0 || y < 0 || x >= C || y >= R) return false;
      if(walls[y][x]) return false;
      if(isDoor(x, y)) return !!ghost;
      return true;
    }
    const wrap = (x) => (x + C) % C;

    const player = document.createElement('img');
    player.src = LOGO_GIF_DATA_URI;
    player.className = 'game-sprite';
    player.style.width = player.style.height = Math.round(cell * 1.35) + 'px';
    shell.stage.appendChild(player);

    // power dots are little rounds cut from the photography, bonus items are album covers
    const photoSrcs = shuffled(getAllSitePhotos().map(p => p.src).filter(Boolean));
    const powerImgs = new Map();
    power.forEach(k => {
      const [x, y] = k.split(',').map(Number);
      const im = document.createElement('img');
      im.className = 'game-sprite game-power';
      im.src = photoSrcs.length ? photoSrcs[powerImgs.size % photoSrcs.length] : LOGO_GIF_DATA_URI;
      im.style.width = im.style.height = Math.round(cell * 0.86) + 'px';
      im.style.left = (x * cell + cell / 2) + 'px';
      im.style.top = (y * cell + cell / 2) + 'px';
      shell.stage.appendChild(im);
      powerImgs.set(k, im);
    });
    const musicDir = resolveDirNode('journal/music');
    const covers = musicDir ? Object.values(musicDir.files).map(f => f.cover).filter(Boolean) : [];
    const bonusImg = document.createElement('img');
    bonusImg.className = 'game-sprite game-bonus';
    bonusImg.style.width = bonusImg.style.height = Math.round(cell * 1.05) + 'px';
    bonusImg.style.display = 'none';
    shell.stage.appendChild(bonusImg);
    let bonus = null, bonusClock = 14;

    let lives = 3, score = 0, alive = true, paused = true, frightT = 0, eatChain = 0;
    const pac = { x: start.x, y: start.y, fx: start.x, fy: start.y, dir: [0,0], want: [-1,0], t: 0, step: 0.14 };
    let ghosts = [];
    function resetActors(){
      pac.x = pac.fx = start.x; pac.y = pac.fy = start.y; pac.dir = [0,0]; pac.want = [-1,0]; pac.t = 0;
      ghosts = house.map((h, i) => ({
        x: h.x, y: h.y, fx: h.x, fy: h.y, px: h.x, py: h.y, dir: [0,-1], t: 0,
        color: GHOST_COLS[i % GHOST_COLS.length], inHouse: true, release: 1 + i * 2.2,
        mode: 'normal', idx: i,
      }));
      ghosts.push({ x: exitCell.x, y: exitCell.y, fx: exitCell.x, fy: exitCell.y, px: exitCell.x, py: exitCell.y, dir: [-1,0], t: 0, color: GHOST_COLS[3], inHouse: false, release: 0, mode: 'normal', idx: 3 });
      frightT = 0;
    }

    function ghostTarget(g){
      if(g.mode === 'eaten') return exitCell;
      if(g.inHouse) return exitCell;
      if(g.idx === 1) return { x: pac.x + pac.dir[0] * 4, y: pac.y + pac.dir[1] * 4 };
      if(g.idx === 2 && Math.random() < 0.5) return { x: rint(0, C - 1), y: rint(0, R - 1) };
      if(g.idx === 3){
        const d = Math.hypot(g.x - pac.x, g.y - pac.y);
        if(d < 7) return { x: 1, y: R - 2 };
      }
      return { x: pac.x, y: pac.y };
    }
    function chooseGhostDir(g){
      const opts = [[0,-1],[-1,0],[0,1],[1,0]].filter(d => {
        if(d[0] === -g.dir[0] && d[1] === -g.dir[1]) return false;
        const nx = g.x + d[0], ny = g.y + d[1];
        if(!open(nx, ny, g.inHouse || g.mode === 'eaten')) return false;
        return true;
      });
      if(!opts.length) return [-g.dir[0], -g.dir[1]];
      if(g.mode === 'fright') return pick(opts);
      const t = ghostTarget(g);
      opts.sort((a, b) => Math.hypot(g.x + a[0] - t.x, g.y + a[1] - t.y) - Math.hypot(g.x + b[0] - t.x, g.y + b[1] - t.y));
      return opts[0];
    }

    function stepPac(){
      pac.fx = pac.x; pac.fy = pac.y;
      if(open(pac.x + pac.want[0], pac.y + pac.want[1], false)) pac.dir = pac.want.slice();
      if(!open(pac.x + pac.dir[0], pac.y + pac.dir[1], false)){ pac.dir = [0,0]; return; }
      pac.x = wrap(pac.x + pac.dir[0]); pac.y += pac.dir[1];
      if(Math.abs(pac.x - pac.fx) > 1) pac.fx = pac.x - pac.dir[0];
      const k = pac.x + ',' + pac.y;
      if(dots.delete(k)) score += 10;
      if(bonus && bonus.x === pac.x && bonus.y === pac.y){
        score += 500; bonus = null; bonusImg.style.display = 'none';
      }
      if(power.delete(k)){
        const im = powerImgs.get(k); if(im) im.remove();
        score += 50; frightT = 7; eatChain = 0;
        ghosts.forEach(g => { if(g.mode === 'normal' && !g.inHouse){ g.mode = 'fright'; g.dir = [-g.dir[0], -g.dir[1]]; } });
      }
    }
    function stepGhost(g){
      g.fx = g.x; g.fy = g.y;
      if(g.inHouse && g.release > 0) return;
      g.dir = chooseGhostDir(g);
      g.x = wrap(g.x + g.dir[0]); g.y += g.dir[1];
      if(Math.abs(g.x - g.fx) > 1) g.fx = g.x - g.dir[0];
      if(g.x === exitCell.x && g.y === exitCell.y){
        if(g.inHouse) g.inHouse = false;
        if(g.mode === 'eaten'){ g.mode = 'normal'; }
      }
    }
    function collide(){
      for(const g of ghosts){
        const same = g.x === pac.x && g.y === pac.y;
        const swapped = g.fx === pac.x && g.fy === pac.y && g.x === pac.fx && g.y === pac.fy;
        if(!same && !swapped) continue;
        if(g.mode === 'fright'){
          g.mode = 'eaten'; eatChain++; score += 200 * eatChain;
        } else if(g.mode === 'normal'){
          return true;
        }
      }
      return false;
    }

    function drawGhost(g, gx, gy){
      const r = cell * 0.46;
      const cx = gx * cell + cell / 2, cy = gy * cell + cell / 2;
      if(g.mode !== 'eaten'){
        let col = g.color;
        if(g.mode === 'fright') col = (frightT < 2 && Math.floor(frightT * 6) % 2) ? colFg : '#3550ff';
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(cx, cy - r * 0.15, r, Math.PI, 0);
        ctx.lineTo(cx + r, cy + r);
        const waves = 3;
        for(let i = 0; i < waves; i++){
          const x1 = cx + r - (2 * r / waves) * (i + 0.5);
          const x2 = cx + r - (2 * r / waves) * (i + 1);
          ctx.lineTo(x1, cy + r * 0.62);
          ctx.lineTo(x2, cy + r);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#fff';
      [-0.36, 0.36].forEach(o => { ctx.beginPath(); ctx.arc(cx + o * r, cy - r * 0.2, r * 0.26, 0, Math.PI * 2); ctx.fill(); });
      ctx.fillStyle = '#123';
      [-0.36, 0.36].forEach(o => { ctx.beginPath(); ctx.arc(cx + o * r + g.dir[0] * r * 0.1, cy - r * 0.2 + g.dir[1] * r * 0.1, r * 0.12, 0, Math.PI * 2); ctx.fill(); });
    }
    function lerp(a, b, t){ return a + (b - a) * t; }
    function draw(){
      ctx.clearRect(0, 0, C * cell, R * cell);
      ctx.font = '700 ' + Math.round(cell * 0.72) + "px 'JetBrains Mono', monospace";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let n = 0;
      ctx.font = '400 ' + Math.round(cell * 0.62) + "px 'JetBrains Mono', monospace";
      ctx.globalAlpha = 0.38;
      ctx.fillStyle = colDim;
      for(let y = 0; y < R; y++) for(let x = 0; x < C; x++){
        if(walls[y][x]) ctx.fillText(WALL_WORD[n++ % WALL_WORD.length], x * cell + cell / 2, y * cell + cell / 2 + 1);
      }
      ctx.globalAlpha = 1;
      for(let y = 0; y < R; y++) for(let x = 0; x < C; x++){
        if(isDoor(x, y)){
          ctx.fillStyle = colMedia;
          ctx.fillRect(x * cell + 2, y * cell + cell / 2 - 1, cell - 4, 2);
        }
      }
      ctx.fillStyle = colFg;
      ctx.shadowColor = colFg; ctx.shadowBlur = 6;
      dots.forEach(k => { const [x, y] = k.split(',').map(Number); ctx.beginPath(); ctx.arc(x * cell + cell / 2, y * cell + cell / 2, Math.max(2, cell * 0.1), 0, Math.PI * 2); ctx.fill(); });
      ctx.shadowBlur = 0;
      const pulse = 0.82 + 0.18 * Math.sin(performance.now() / 160);
      powerImgs.forEach((im, k) => { if(power.has(k)) im.style.transform = 'translate(-50%,-50%) scale(' + pulse.toFixed(3) + ')'; });
      if(bonus){
        bonusImg.style.left = (bonus.x * cell + cell / 2) + 'px';
        bonusImg.style.top = (bonus.y * cell + cell / 2) + 'px';
      }
      ghosts.forEach(g => {
        const t = g.inHouse && g.release > 0 ? 1 : Math.min(1, g.t / ghostStep(g));
        drawGhost(g, lerp(g.fx, g.x, t), lerp(g.fy, g.y, t));
      });
      const pt = Math.min(1, pac.t / pac.step);
      const px = lerp(pac.fx, pac.x, pt), py = lerp(pac.fy, pac.y, pt);
      player.style.left = (px * cell + cell / 2) + 'px';
      player.style.top = (py * cell + cell / 2) + 'px';
      const flip = pac.dir[0] < 0 ? -1 : 1;
      const rot = pac.dir[1] < 0 ? -90 : (pac.dir[1] > 0 ? 90 : 0);
      player.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg) scaleX(' + flip + ')';
      shell.score.textContent = 'score ' + score + '   lives ' + '●'.repeat(Math.max(0, lives));
    }
    function ghostStep(g){ return g.mode === 'eaten' ? 0.07 : g.mode === 'fright' ? 0.26 : 0.165; }

    let last = performance.now();
    function frame(now){
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if(!paused && alive){
        if(frightT > 0){ frightT -= dt; if(frightT <= 0) ghosts.forEach(g => { if(g.mode === 'fright') g.mode = 'normal'; }); }
        // an album cover shows up now and then as a bonus
        bonusClock -= dt;
        if(bonusClock <= 0){
          if(bonus){ bonus = null; bonusImg.style.display = 'none'; bonusClock = 12 + Math.random() * 10; }
          else if(covers.length){
            bonus = { x: start.x, y: start.y };
            bonusImg.src = pick(covers);
            bonusImg.style.display = '';
            bonusClock = 9;
          }
        }
        pac.t += dt;
        if(pac.t >= pac.step){ pac.t = 0; stepPac(); }
        ghosts.forEach(g => {
          if(g.inHouse && g.release > 0){ g.release -= dt; return; }
          g.t += dt;
          if(g.t >= ghostStep(g)){ g.t = 0; stepGhost(g); }
        });
        if(collide()) loseLife();
        if(!dots.size && !power.size){
          alive = false;
          shell.msg.textContent = 'cleared · ' + score;
          setTimeout(() => endGame(shell, unbind, 'you cleared the maze. score ' + score + '.'), 1600);
        }
      }
      draw();
      if(activeGame) activeGame.raf = requestAnimationFrame(frame);
    }
    function loseLife(){
      lives--;
      paused = true;
      if(lives <= 0){
        alive = false;
        shell.msg.textContent = 'game over · ' + score;
        shell.layer.classList.add('dead');
        setTimeout(() => endGame(shell, unbind, 'the ghosts got you. score ' + score + '.'), 1500);
        return;
      }
      shell.msg.textContent = 'caught';
      setTimeout(() => { resetActors(); shell.msg.textContent = ''; paused = false; }, 1100);
    }
    const unbind = bindControls(shell.layer, (dx, dy) => { pac.want = [dx, dy]; }, () => { alive = false; endGame(shell, unbind, 'ghost quit.'); });
    activeGame = { raf: null };
    resetActors();
    shell.msg.textContent = 'ready';
    setTimeout(() => { if(alive){ shell.msg.textContent = ''; paused = false; } }, 900);
    activeGame.raf = requestAnimationFrame(frame);
  }

  /* ---------- looks: themes, layout fx, physics ---------- */
  const THEMES = ['geocity', 'crt', 'darkroom'];
  const THEME_VARS = ['--bg', '--fg', '--fg-dim', '--line', '--dir', '--media', '--err'];
  const rootStyle = document.documentElement.style;
  const BASE_VARS = {};
  THEME_VARS.forEach(v => { BASE_VARS[v] = rootStyle.getPropertyValue(v); });

  function setVars(map){ Object.keys(map).forEach(k => rootStyle.setProperty(k, map[k])); }
  function restoreVars(){
    THEME_VARS.forEach(v => {
      if(BASE_VARS[v]) rootStyle.setProperty(v, BASE_VARS[v]);
      else rootStyle.removeProperty(v);
    });
  }

  function garishPalette(){
    const h = Math.floor(Math.random() * 360);
    const pick = (off, s, l) => 'hsl(' + ((h + off) % 360) + ',' + s + '%,' + l + '%)';
    return {
      '--bg': pick(0, 100, 22 + Math.random() * 10),
      '--fg': pick(180, 100, 72),
      '--fg-dim': pick(60, 100, 62),
      '--line': pick(300, 100, 50),
      '--dir': pick(120, 100, 60),
      '--media': pick(240, 100, 65),
      '--err': pick(30, 100, 60),
    };
  }

  const THEME_LINES = {
    geocity: 'welcome to my homepage!! best viewed in netscape navigator 4.0 at 800x600.',
    crt: 'warming up the tube...',
    darkroom: 'safelight on. let your eyes adjust.',
  };

  function applyTheme(name){
    const already = document.body.classList.contains('theme-' + name);
    THEMES.forEach(t => document.body.classList.remove('theme-' + t));
    stopCrtGutters();
    restoreVars();
    if(already && name !== 'geocity'){ printLine(name + ' off.', 'dim'); return; }
    document.body.classList.add('theme-' + name);
    if(name === 'geocity') setVars(garishPalette());
    if(name === 'crt') startCrtGutters();
    if(name === 'crt') setVars({ '--bg':'#020b04', '--fg':'#5dff8f', '--fg-dim':'#2d9a55', '--line':'#0f3a1d', '--dir':'#b6ffcb', '--media':'#9dff3a', '--err':'#ffd84d' });
    if(name === 'darkroom') setVars({ '--bg':'#080000', '--fg':'#ff4a3d', '--fg-dim':'#9c241c', '--line':'#3a0905', '--dir':'#ff7a5c', '--media':'#ff2a1a', '--err':'#ffb199' });
    printLine(THEME_LINES[name] + "  (type 'reset' to go back)", 'dim');
  }

  const FX_LINES = {
    negative: 'printing from the negative.',
    australia: "g'day.",
    mirror: '.sdrawkcab ti daer',
    tilt: 'someone bumped the desk.',
  };
  function toggleFx(name){
    const on = !document.documentElement.classList.contains('fx-' + name);
    document.documentElement.classList.toggle('fx-' + name, on);
    printLine(on ? FX_LINES[name] : name + ' off.', 'dim');
  }

  const PHYSICS_LINES = {
    gravity: 'gravity on. the pop-out windows will fall.',
    antigravity: 'gravity reversed. up is the new down.',
    magnet: 'the pop-out windows are drawn to your cursor now.',
    drift: 'zero g. everything drifts again.',
  };
  function setPhysics(mode){
    floatPhysics = mode;
    floatWins.forEach(w => { if(mode !== 'drift'){ w.ignoreHover = false; } });
    let line = PHYSICS_LINES[mode];
    if(!floatWins.length && mode !== 'drift') line += " (open about, contact or work/equipment.txt to see it)";
    printLine(line, 'dim');
    if(floatWins.length) startFloatLoop();
  }

  function resetLooks(){
    stopCrtGutters();
    THEMES.forEach(t => document.body.classList.remove('theme-' + t));
    Object.keys(FX_LINES).forEach(f => document.documentElement.classList.remove('fx-' + f));
    restoreVars();
    floatPhysics = 'drift';
    printLine('back to normal.', 'dim');
  }

  function runCommand(raw){
    const cmdLine = raw.trim();
    printEcho(cmdLine);
    if(!cmdLine) return;
    history.push(cmdLine);
    histIdx = history.length;

    const parts = cmdLine.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const arg = parts.slice(1).join(' ');

    switch(cmd){
      case 'help': case 'menu': printHelp(); break;
      case 'ls': doLs(arg); break;
      case 'cd': doCd(arg); break;
      case 'cat': case 'open': case 'less': case 'more': doCat(arg); break;
      case 'pwd': printLine(cwd ? '~/' + cwd : '~'); break;
      case 'whoami':
        (async () => {
          try{
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            printLine("you're " + data.ip + ', of course!');
          }catch(e){
            printLine("you're a mystery, apparently.", 'dim');
          }
        })();
        break;
      case 'contact': doCat('contact.txt'); break;
      case 'about': doCat('about.txt'); break;
      case 'work': doLs('work'); break;
      case 'journal': doLs('journal'); break;
      case 'clear': clearOutput(); break;
      case 'geocity': case 'geocities': applyTheme('geocity'); break;
      case 'crt': applyTheme('crt'); break;
      case 'darkroom': applyTheme('darkroom'); break;
      case 'negative': toggleFx('negative'); break;
      case 'australia': toggleFx('australia'); break;
      case 'mirror': toggleFx('mirror'); break;
      case 'tilt': toggleFx('tilt'); break;
      case 'gravity': case 'antigravity': case 'magnet': case 'zerog': setPhysics(cmd === 'zerog' ? 'drift' : cmd); break;
      case 'reset': case 'normal': resetLooks(); break;
      case 'serpent': case 'snake': launchGame(startSerpent); break;
      case 'ghost': case 'pacman': launchGame(startGhost); break;
      case ':)': surprise(); break;
      case 'sudo': case 'rm': case 'vim': case 'emacs': printLine('no.', 'dim'); break;
      case 'exit': case 'logout': case 'quit':
        printLine("there's no escaping a static site. thanks for stopping by though.", 'dim'); break;
      default:
        printLine("why can't i find you? type 'help' for a list of commands.", 'err');
    }
    focusInput();
  }

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const val = input.value;
      input.value = '';
      runCommand(val);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(histIdx > 0){ histIdx--; input.value = history[histIdx] || ''; }
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(histIdx < history.length){ histIdx++; input.value = history[histIdx] || ''; }
    }
  });

  document.addEventListener('mouseup', (e) => {
    if(e.target && e.target.closest && e.target.closest('input, textarea, select, a, .compose, .float-win')) return;
    const sel = window.getSelection();
    if(sel && sel.toString().length > 0) return;
    focusInput();
  });

  function scrambleInto(elm, delaySec, durSec){
    const finalText = elm.textContent;
    if(!finalText) return;
    const len = finalText.length;
    elm.textContent = '';
    const start = performance.now() + delaySec * 1000;
    const totalMs = Math.max(durSec * 1000, 1);
    const perCharMs = totalMs / len;
    const settleFrac = 0.55; // portion of each character's slot spent scrambling before it locks in
    function frame(now){
      if(now < start){ requestAnimationFrame(frame); return; }
      const elapsed = now - start;
      if(elapsed >= totalMs){ elm.textContent = finalText; return; }
      const settledCount = Math.floor(elapsed / perCharMs);
      let out = finalText.slice(0, settledCount);
      const ch = finalText[settledCount];
      if(ch !== undefined){
        if(ch === ' ' || ch === '\n'){
          out += ch;
        } else {
          const withinSlot = (elapsed - settledCount * perCharMs) / perCharMs;
          out += (withinSlot >= settleFrac) ? ch : SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
        }
      }
      elm.textContent = out;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function getScrambleTargets(elm){
    if(elm.classList.contains('line')) return [elm];
    if(elm.classList.contains('inputrow')){
      const s = elm.querySelector('.promptlabel');
      return s ? [s] : [];
    }
    const spans = Array.from(elm.querySelectorAll('span')).filter(s => !s.querySelector('span'));
    return spans.length ? spans : [elm];
  }

  function decodeInRows(box, stepSec, durSec){
    if(REDUCED_MOTION) return;
    Array.from(box.children).forEach((row, i) => {
      const delay = i * stepSec;
      row.style.animationDelay = delay.toFixed(2) + 's';
      row.style.animationDuration = durSec.toFixed(2) + 's';
      row.classList.add('boot-flicker');
      getScrambleTargets(row).forEach(t => scrambleInto(t, delay, durSec));
    });
  }

  function flickerElement(elm){
    if(REDUCED_MOTION) return;
    const delay = Math.random() * 0.6;
    const dur = 1.3 + Math.random() * 0.9;
    elm.style.animationDelay = delay.toFixed(2) + 's';
    elm.style.animationDuration = dur.toFixed(2) + 's';
    elm.classList.add('boot-flicker');
    getScrambleTargets(elm).forEach(t => scrambleInto(t, delay, dur));
  }

  function runBootFlicker(){
    const targets = [];
    const topbar = document.querySelector('.topbar');
    if(topbar) targets.push(topbar);
    const intro = document.querySelector('.boot-intro');
    if(intro) intro.querySelectorAll('.line').forEach(l => targets.push(l));
    if(rootPanelBody){
      const panel = rootPanelBody.closest('.panel');
      if(panel){
        const head = panel.querySelector('.panelhead');
        if(head) targets.push(head);
      }
      rootPanelBody.querySelectorAll('.listing > div').forEach(row => targets.push(row));
    }
    const inputRow = document.querySelector('.inputrow');
    if(inputRow) targets.push(inputRow);
    targets.forEach(flickerElement);
  }

  function boot(){
    const intro = el('div', 'entry boot-intro');
    const introRow = el('div', 'boot-intro-row');
    const textCol = el('div', 'boot-intro-text');
    textCol.appendChild(el('div', 'line dim', esc('connected to elijahhalford.tty — session started')));
    textCol.appendChild(el('div', 'line dim', esc(isNarrow()
      ? "video & photo, orlando. tap anything below to get started."
      : "video & photo, orlando. type 'help' to get started.")));
    introRow.appendChild(textCol);
    const logo = document.createElement('img');
    logo.className = 'boot-logo';
    logo.src = LOGO_GIF_DATA_URI;
    logo.alt = '';
    logo.draggable = false;
    logo.addEventListener('contextmenu', denySaveSilent);
    introRow.appendChild(logo);
    intro.appendChild(introRow);
    output.appendChild(intro);
    printRootListing();
    focusInput();
    runBootFlicker();
  }

  function reviveThenBoot(){
    const overlay = el('div', 'revive-overlay');
    const gif = document.createElement('img');
    gif.className = 'revive-gif';
    gif.src = REBIRTH_GIF_DATA_URI;
    gif.alt = '';
    gif.draggable = false;
    overlay.appendChild(gif);
    const msg = el('div', 'line dim');
    msg.textContent = 'very well...';
    msg.style.opacity = '0';
    overlay.appendChild(msg);
    document.body.appendChild(overlay);

    setTimeout(() => { msg.style.opacity = '1'; gif.style.opacity = '0.5'; }, 0);
    scrambleInto(msg, 0, 1);

    setTimeout(() => { location.reload(); }, 1800);
  }

  if(mobileDock){
    mobileDock.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => runCommand(btn.dataset.cmd));
    });
  }
  const onLayoutChange = () => updatePrompt();
  if(MQ_NARROW.addEventListener) MQ_NARROW.addEventListener('change', onLayoutChange);
  else if(MQ_NARROW.addListener) MQ_NARROW.addListener(onLayoutChange);

  // once the page is up, quietly fetch the easter-egg images so they appear instantly
  function warmSiteImages(){
    [ABOUT_GIF_DATA_URI, SURPRISE_DATA_URI, REBIRTH_GIF_DATA_URI].forEach(u => { const i = new Image(); i.src = u; });
  }
  window.addEventListener('load', () => {
    if('requestIdleCallback' in window) requestIdleCallback(warmSiteImages, { timeout: 4000 });
    else setTimeout(warmSiteImages, 2000);
  });

  function startup(){
    updatePrompt();
    if(location.hash === '#ended'){
      try{ history.replaceState(null, '', location.pathname + location.search); }
      catch(e){ location.hash = ''; }
      reviveThenBoot();
    } else {
      boot();
    }
  }
  startup();
})();
</script>

</body>
</html>
