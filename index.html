    --dir:#8FA88A;
    --media:#C97B52;
    --err:#C97B52;
    --line:#262622;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:15px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
  ::selection{ background:var(--fg); color:var(--bg); }
  :focus-visible{ outline:1px solid var(--fg); outline-offset:2px; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  .app-shell{
    height:100vh;
    height:100svh;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }

  .term{
    height:100vh;
    height:100svh;
    display:flex;
    flex-direction:column;
    max-width:840px;
    width:100%;
    flex:none;
    padding:0 20px;
    transition:max-width 0.45s cubic-bezier(.4,0,.2,1);
  }
  .app-shell.gallery-open .term,
  .app-shell.video-gallery-open .term{
    max-width:50vw;
  }

  .gallery-pane{
    flex:none;
    width:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
    transition:width 0.45s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
  }
  .app-shell.gallery-open .gallery-pane{
    width:50vw;
    border-left:1px solid var(--line);
  }
  .video-gallery-pane{
    flex:none;
    width:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
    transition:width 0.45s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
  }
  .app-shell.video-gallery-open .video-gallery-pane{
    width:50vw;
    border-right:1px solid var(--line);
  }
  .galleryhead{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    color:var(--fg-dim);
    border-bottom:1px solid var(--line);
    padding:16px 18px 10px;
    white-space:nowrap;
  }
  .gallerybody{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 18px;
    min-width:340px;
    scrollbar-width:auto;
    scrollbar-color:var(--fg-dim) var(--bg);
  }
  .gallerybody::-webkit-scrollbar{ width:16px; }
  .gallerybody::-webkit-scrollbar-track{
    background:var(--bg);
    border-left:1px solid var(--line);
  }
  .gallerybody::-webkit-scrollbar-thumb{
    background:var(--line);
    border:1px solid var(--fg-dim);
    border-radius:0;
  }
  .gallerybody::-webkit-scrollbar-thumb:hover{ background:var(--fg-dim); }
  .gallerybody::-webkit-scrollbar-button{ display:none; }
  .gallery-jump-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
  }
  .gallery-jump{
    display:block;
    width:100%;
    text-align:left;
    color:var(--fg-dim);
    border:1px solid var(--line);
    padding:6px 10px;
    background:none;
  }
  .gallery-jump:hover, .gallery-jump:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .gallery-section-title{
    color:var(--dir);
    margin:18px 0 8px;
  }
  .gallery-section-title:first-child{ margin-top:0; }
  .gallery-grid{
    columns:2;
    column-gap:12px;
  }
  .gallery-thumb{
    display:block;
    width:100%;
    margin:0 0 12px;
    break-inside:avoid;
    border:1px solid var(--line);
    background:none;
    padding:0;
    overflow:hidden;
    opacity:0;
    animation:thumbIn 0.35s ease forwards;
  }
  .gallery-thumb:hover, .gallery-thumb:focus-visible{ border-color:var(--fg-dim); }
  .gallery-thumb img{
    width:100%; height:auto; display:block;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  @keyframes thumbIn{ to{ opacity:1; } }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:40px;
  }
  .lightbox.open{ display:flex; }
  .lightbox-content{
    display:flex;
    align-items:center;
    gap:24px;
    max-width:1100px;
    max-height:100%;
    width:auto;
  }
  .lightbox-image-wrap{
    flex:0 1 auto;
    display:inline-flex;
    max-width:100%;
    max-height:80vh;
    overflow:hidden;
    border:1px solid var(--line);
    cursor:zoom-in;
  }
  .lightbox-image{
    flex:none;
    max-width:100%;
    max-height:80vh;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    transition:transform 0.15s ease;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  .lightbox-image.zoomed{ transition:none; }
  .lightbox-info{
    flex:none;
    width:240px;
    color:var(--fg-dim);
    padding-top:4px;
  }
  .lightbox-filename{ color:var(--fg); margin-bottom:10px; word-break:break-word; }
  .lightbox-camera{ margin-bottom:4px; }
  .lightbox-lens{ margin-bottom:4px; }
  .lightbox-film{ margin-bottom:4px; }
  .lightbox-format{ margin-bottom:14px; }
  .lightbox-artist{ margin-bottom:4px; }
  .lightbox-medium{ margin-bottom:14px; }
  .lightbox-desc{ line-height:1.6; }
  .lightbox-close, .lightbox-arrow{
    position:fixed;
    border:1px solid var(--line);
    color:var(--fg-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.4);
  }
  .lightbox-close:hover, .lightbox-arrow:hover,
  .lightbox-close:focus-visible, .lightbox-arrow:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .lightbox-close{ top:20px; right:20px; width:32px; height:32px; font-size:1.1rem; }
  .lightbox-arrow{ top:50%; transform:translateY(-50%); width:44px; height:44px; font-size:1.4rem; }
  .lightbox-prev{ left:20px; }
  .lightbox-next{ right:20px; }

  @media (max-width: 760px){
    .app-shell.gallery-open .term,
    .app-shell.video-gallery-open .term{ display:none; }
    .app-shell.gallery-open .gallery-pane,
    .app-shell.video-gallery-open .video-gallery-pane{ width:100vw; border:none; }
    .gallerybody{ min-width:0; padding:14px 14px calc(24px + env(safe-area-inset-bottom)); }
    .galleryhead{ padding:calc(12px + env(safe-area-inset-top)) 14px 10px; }
    .gallery-grid, .video-list{ column-gap:8px; }
    .gallery-thumb, .video-card{ margin-bottom:8px; }

    .lightbox{
      padding:calc(64px + env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
      align-items:flex-start;
      overflow-y:auto;
      background:#000;
    }
    .lightbox-content{ flex-direction:column; align-items:stretch; gap:14px; width:100%; max-height:none; }
    .lightbox-image-wrap{ max-height:62svh; width:100%; justify-content:center; cursor:default; border:none; }
    .lightbox-image{ max-height:62svh; margin:0 auto; }
    .lightbox-info{ width:100%; padding-top:0; }
    .lightbox-close{ top:calc(12px + env(safe-area-inset-top)); right:12px; width:44px; height:44px; font-size:1.3rem; }
    .lightbox-arrow{
      top:auto; transform:none;
      bottom:calc(16px + env(safe-area-inset-bottom));
      width:64px; height:48px;
    }
    .lightbox-prev{ left:14px; }
    .lightbox-next{ right:14px; }
  }

  .video-list{
    columns:2;
    column-gap:12px;
  }
  .video-card{
    display:block;
    width:100%;
    margin:0 0 12px;
    break-inside:avoid;
    border:1px solid var(--line);
    padding:0;
    overflow:hidden;
    opacity:0;
    animation:thumbIn 0.35s ease forwards;
  }
  .video-thumb{
    display:block;
    width:100%;
    position:relative;
    border:none;
    background:none;
    padding:0;
    overflow:hidden;
  }
  .video-thumb img{
    width:100%; height:auto; display:block;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  .video-thumb::after{

    border:1px solid var(--fg-dim);
    color:var(--fg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.8rem;
    pointer-events:none;
  }
  .video-thumb:hover::after, .video-thumb:focus-visible::after{
    border-color:var(--fg);
  }
  .video-meta{
    padding:8px 10px 12px;
  }
  .video-title{
    color:var(--fg);
    margin-bottom:4px;
  }
  .video-desc{
    color:var(--fg-dim);
    line-height:1.6;
  }

  .about-header-text{ margin:0 0 1.65em; }
  .about-gif-pin{
    float:right;
    width:128px;
    height:auto;
    margin:0 0 14px 18px;
    border:1px solid var(--line);
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
  }
  @media (max-width: 760px){
    .about-gif-pin{ width:29%; max-width:115px; }
  }

  .tie-accent{
    color:var(--dir);
    cursor:pointer;
    text-decoration:underline dotted;
    text-underline-offset:3px;
  }
  .tie-accent:hover{
    filter:brightness(1.2);
  }

  .boot-intro-row{
    position:relative;
  }
  .boot-intro-text{
    min-width:0;
    padding-right:114px;
  }
  .boot-logo{
    display:block;
    position:absolute;
    top:50%;
    right:0;
    transform:translateY(-50%);
    height:72px;
    width:auto;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
  }

  .topbar{
    flex:none;
    padding:16px 0 10px;
    color:var(--fg-dim);
    font-size:0.82rem;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .handle-link{ cursor:pointer; }
  .handle-link:hover, .handle-link:focus-visible{
    color:var(--fg);
    text-decoration:underline;
  }

  .output{
    flex:1 1 auto;
    overflow-y:auto;
    padding:18px 0;
    scrollbar-width:auto;
    scrollbar-color:var(--fg-dim) var(--bg);
  }
  .output::-webkit-scrollbar{ width:16px; }
  .output::-webkit-scrollbar-track{
    background:var(--bg);
    border-left:1px solid var(--line);
  }
  .output::-webkit-scrollbar-thumb{
    background:var(--line);
    border:1px solid var(--fg-dim);
    border-radius:0;
  }
  .output::-webkit-scrollbar-thumb:hover{ background:var(--fg-dim); }
  .output::-webkit-scrollbar-button{ display:none; }

  .line{
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:2px;
  }
  .line.echo{ margin-top:14px; color:var(--fg); }
  .line.echo .prompt{ color:var(--dir); }
  .line.err{ color:var(--err); }
  .line.dim{ color:var(--fg-dim); }
  .quote-line{ margin-bottom:4.95em; }

  .revive-overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    z-index:200;
  }
  .revive-overlay .line{ font-size:1.05rem; margin-bottom:0; position:relative; z-index:1; transition:opacity 1s ease; }
  .revive-gif{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    max-width:min(70vw,340px);
    max-height:min(70vh,340px);
    width:auto; height:auto;
    opacity:0;
    transition:opacity 1s ease;
    pointer-events:none;
    z-index:0;
  }

  .panel{ margin:10px 0 16px; }
  .panelhead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    color:var(--fg-dim);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .panelhead .panelname{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panelhead-actions{ flex:none; display:flex; align-items:center; gap:6px; }
  .closebtn, .backbtn{
    flex:none;
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    color:var(--fg-dim);
    line-height:1;
    font-size:0.85rem;
  }
  .closebtn:hover, .closebtn:focus-visible,
  .backbtn:hover, .backbtn:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .panelbody pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-family:inherit;
    font-size:inherit;
  }

  .album-view{
    display:flex;
    gap:20px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .album-cover-link{ flex:none; display:block; }
  .album-cover{
    width:160px;
    height:160px;
    object-fit:cover;
    border:1px solid var(--line);
    display:block;
  }
  .album-meta{
    flex:1;
    min-width:180px;
    padding-top:2px;
  }
  .album-title{
    color:var(--fg);
    font-size:1rem;
    margin-bottom:4px;
  }
  .album-artist{ color:var(--fg-dim); margin-bottom:10px; }
  .album-sub{ color:var(--fg-dim); font-size:0.85em; margin-bottom:14px; }
  .album-link{
    color:var(--dir);
    text-decoration:underline;
  }
  .album-link:hover, .album-link:focus-visible{ color:var(--fg); }
  .album-links{ display:flex; flex-wrap:wrap; gap:6px 16px; }

  .album-facts{ color:var(--fg-dim); font-size:0.85em; margin-bottom:4px; }
  .album-facts b{ color:var(--fg); font-weight:500; }

  .row-thumb{
    width:1.1em;
    height:1.1em;
    object-fit:cover;
    border:1px solid var(--line);
    vertical-align:-0.18em;
    margin-right:8px;
    flex:none;
  }
  .cover-fallback{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    line-height:1;
  }
  .row-thumb.cover-fallback{ font-size:0.55em; }
  .album-cover.cover-fallback{ font-size:2.2rem; }

  .row-icon{
    display:inline-block;
    width:1.3em;
    flex:none;
    text-align:center;
    color:var(--fg-dim);
    margin-right:6px;
  }

  .listing{ display:flex; flex-direction:column; gap:2px; margin:4px 0 8px; }
  .listing button{
    text-align:left;
    color:var(--fg);
    padding:1px 0;
  }
  .listing button:hover, .listing button:focus-visible{ color:var(--fg); text-decoration:underline; }
  .listing .tag-dir{ color:var(--dir); }
  .listing .tag-media{ color:var(--media); }
  .listing .kind{ color:var(--fg-dim); margin-left:10px; font-size:0.85em; }

  .help-group{
    color:var(--fg-dim);
    font-size:0.8rem;
    margin:14px 0 4px;
  }
  .help-group:first-child{ margin-top:0; }

  .shortcuts{ display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; }
  .help-hint{ margin-top:14px; }
  .shortcuts button{ color:var(--fg-dim); }
  .shortcuts button:hover, .shortcuts button:focus-visible{ color:var(--fg); text-decoration:underline; }

  .inputrow.gone{ display:none; }
  .inputrow{
    flex:none;
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:12px 0 18px;
    border-top:1px solid var(--line);
  }
  .promptlabel{ color:var(--dir); white-space:pre; padding-top:2px; }
  .inputrow input{
    flex:1;
    background:none;
    border:none;
    color:var(--fg);
    font:inherit;
    padding-top:2px;
  }
  .inputrow input:focus{ outline:none; }

  @media (max-width:600px){
    .term{ padding:0 14px; }
    body{ font-size:14px; }
  }

  .flash{
    position:fixed; inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:50;
  }
  .flash.on{ animation:shutter 160ms ease-out; }
  @keyframes shutter{
    0%{ opacity:0; }
    18%{ opacity:1; }
    100%{ opacity:0; }
  }

  .boot-flicker{
    animation-name:flicker;
    animation-timing-function:linear;
    animation-fill-mode:both;
    animation-iteration-count:1;
  }
  @keyframes flicker{
    0%{ opacity:0; }
    4%{ opacity:1; }
    8%{ opacity:0.15; }
    12%{ opacity:1; }
    18%{ opacity:0.08; }
    24%{ opacity:1; }
    30%{ opacity:0.3; }
    38%{ opacity:1; }
    46%{ opacity:0.12; }
    54%{ opacity:1; }
    64%{ opacity:0.4; }
    72%{ opacity:1; }
    100%{ opacity:1; }
  }

  .sr-only{

  .noscript-card{ max-width:640px; margin:0 auto; padding:40px 20px; line-height:1.7; }
  .noscript-card p{ margin-bottom:14px; }
  .noscript-card a{ color:var(--fg); }

  .contact-link:hover, .contact-link:focus-visible{ color:var(--fg); }

    -webkit-appearance:none; appearance:none;

  }
  .compose-send:hover, .compose-send:focus-visible{ background:var(--fg); color:var(--bg); }
  .compose-status{ color:var(--fg-dim); font-size:0.85em; }
  .compose-status.err{ color:var(--err); }

  /* ---- mobile dock (hidden on desktop) ---- */
  .mobile-dock{ display:none; }
  .mobile-dock.gone{ display:none !important; }

  @media (max-width: 760px){
    body{ font-size:14px; -webkit-text-size-adjust:100%; }
    .term{ padding:0 14px; }
    .topbar{ padding:calc(12px + env(safe-area-inset-top)) 0 10px; }

    .panel{ margin:8px 0 14px; }
    .closebtn, .backbtn{ width:34px; height:34px; font-size:1rem; }
    .panelhead{ padding-bottom:8px; }

    .listing{ gap:0; }
    .listing button{
      display:flex; flex-wrap:wrap; align-items:center;
      width:100%;
      padding:9px 0;
      border-bottom:1px solid var(--line);
    }
    .listing > div:last-child button{ border-bottom:none; }
    .listing button:hover, .listing button:focus-visible{ text-decoration:none; }
    .listing button:active{ background:var(--line); }

  function buildPhotoFiles(entries, mode){
    const files = {};
    entries.forEach(([id, filename], i) => {
      const filmInfo = mode === 'film' ? FILM_DETAILS[filename] : null;
      const digitalInfo = mode === 'digital' ? DIGITAL_DETAILS[filename] : null;
      const stillsInfo = mode === 'stills' ? STILLS_DETAILS[filename] : null;
      let camera = '', lens = '', film = '', format = '', description = '';
      if(mode === 'film'){
        camera = filmInfo ? filmInfo.camera : '';
        lens = filmInfo ? filmInfo.lens : '';
        film = (filmInfo && filmInfo.film) ? filmInfo.film : filmStockFromName(filename);
        format = (filmInfo && filmInfo.format) ? filmInfo.format : FILM_FORMAT;
        description = filmInfo ? filmInfo.description : '';
      } else if(mode === 'digital'){
        camera = digitalInfo ? digitalInfo.camera : DIGITAL_CAMERA;
        lens = digitalInfo ? digitalInfo.lens : DIGITAL_LENS;
        description = digitalInfo ? digitalInfo.description : (DIGITAL_DESCRIPTIONS[filename] || '');
      } else if(mode === 'stills'){
        camera = stillsInfo ? stillsInfo.camera : '';
        lens = stillsInfo ? stillsInfo.lens : '';
        description = stillsInfo ? stillsInfo.description : '';
      }
      files['p' + String(i).padStart(3, '0') + '.photo'] = {
        type:'photo',
        filename: (filmInfo && filmInfo.displayName) ? filmInfo.displayName : filename,
        camera: camera,
        lens: lens,
        film: film,
        format: format,
        description: description,
        src: driveThumb(id, 1600),
      };
    });
    return files;
  }

  function youtubeThumbFallback(id){
    return 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';

  function buildVideoFiles(entries){
    const files = {};
    entries.forEach((v, i) => {
      // If a custom thumbnail lives in Drive (v.driveThumbId), prefer it — falls back
      // to the YouTube-generated thumbnail (and its own hqdefault fallback) otherwise.
      files['v' + String(i).padStart(3, '0') + '.video'] = {
        type:'video',
        videoId: v.id,
        filename: v.title,
        title: v.title,
        description: v.description || '',
        date: v.date || '',
        pinned: !!v.pinned,
        category: v.category || '',
        thumb: v.driveThumbId ? driveThumb(v.driveThumbId, 640) : youtubeThumb(v.id),
        thumbFallback: v.driveThumbId ? youtubeThumb(v.id) : youtubeThumbFallback(v.id),
      };
    });
    return files;
  }

  function splitPath(p){ return p.split('/').filter(Boolean); }

  function resolveNode(pathStr){
    const parts = splitPath(pathStr);
    let node = { type:'dir', files: FS };
    for(const part of parts){
      if(!node || node.type !== 'dir' || !node.files || !node.files[part]) return null;
      node = node.files[part];
    }
    return node;
  }

  function resolveDirNode(pathStr){
    const node = pathStr === '' ? { type:'dir', files: FS } : resolveNode(pathStr);
    return (node && node.type === 'dir') ? node : null;
  }

  function resolveArgPath(arg){
    if(!arg) return cwd;
    const trimmed = arg.replace(/\/$/, '');
    if(resolveNode(trimmed)) return trimmed;
    const rel = cwd ? cwd + '/' + trimmed : trimmed;
    if(resolveNode(rel)) return rel;
    return trimmed;
  }

  const MQ_NARROW = window.matchMedia('(max-width: 760px)');
  const MQ_COARSE = window.matchMedia('(pointer: coarse)');
  function isNarrow(){ return MQ_NARROW.matches; }
  function focusInput(){

    input.focus();

  // Opens an outside link in a new tab. A real <a target=_blank> click is honoured by
  // mobile Safari/Chrome and most in-app browsers more reliably than window.open().
  function openExternal(url){
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // On a phone a tall panel scrolled to the bottom hides its own beginning,
  // so bring the panel's top into view instead.
  function scrollToPanel(panel){
    if(!isNarrow()){ scrollBottom(); return; }
    // wait a frame so the panel's content exists and the output can scroll that far
    requestAnimationFrame(() => {
      const echo = panel.previousElementSibling;
      const anchor = (echo && echo.classList.contains('entry')) ? echo : panel;
      output.scrollTop = Math.max(0, anchor.offsetTop - 6);
    });
  }

  // Renders contact.txt with its email / handles / youtube turned into links.
  function renderContactText(pre, text){
    const re = /([\w.+-]+@[\w-]+\.[\w.-]+)|(^|\s)(@[\w.]+)|(youtube\.com\/\S+)/gm;
    let last = 0, m;
    while((m = re.exec(text))){
      if(m[1]){
        pre.appendChild(document.createTextNode(text.slice(last, m.index)));
        pre.appendChild(contactLink(m[1], 'mailto:' + m[1], false));
        last = m.index + m[1].length;
      } else if(m[3]){
        const start = m.index + m[2].length;
        pre.appendChild(document.createTextNode(text.slice(last, start)));
        pre.appendChild(contactLink(m[3], 'https://www.instagram.com/' + m[3].slice(1) + '/', true));
        last = start + m[3].length;
      } else if(m[4]){
        pre.appendChild(document.createTextNode(text.slice(last, m.index)));
        pre.appendChild(contactLink(m[4], 'https://' + m[4], true));
        last = m.index + m[4].length;
      }
    }
    pre.appendChild(document.createTextNode(text.slice(last)));
  }

  function randomizeAccents(){
    const h1 = Math.floor(Math.random() * 360);
    let h2 = Math.floor(Math.random() * 360);
    if(Math.abs(h1 - h2) < 40) h2 = (h2 + 90) % 360;
    const dir = 'hsl(' + h1 + ', 42%, 62%)';
    const media = 'hsl(' + h2 + ', 55%, 58%)';
    const root = document.documentElement.style;
    root.setProperty('--dir', dir);
    root.setProperty('--media', media);
    root.setProperty('--err', media);
  }

  function hashHue(str){
    let h = 0;
    for(let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) % 360; }
    return h < 0 ? h + 360 : h;
  }

  function initialsFor(name){
    const words = name.replace(/[().,]/g, '').split(/\s+/).filter(Boolean);
    if(words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function swapToCoverFallback(imgEl, seedText){
    const hue = hashHue(seedText);
    const ph = document.createElement('span');
    ph.className = imgEl.className + ' cover-fallback';
    ph.style.background = 'hsl(' + hue + ', 22%, 15%)';
    ph.style.color = 'hsl(' + hue + ', 42%, 74%)';
    ph.textContent = initialsFor(seedText);
    ph.setAttribute('aria-hidden', 'true');
    if(imgEl.parentNode) imgEl.replaceWith(ph);
  }

      thumb.addEventListener('error', () => swapToCoverFallback(thumb, seedText), { once: true });
      return thumb;
    }
    const hue = hashHue(seedText);
    const ph = el('span', 'row-thumb cover-fallback', esc(initialsFor(seedText)));
    ph.style.background = 'hsl(' + hue + ', 22%, 15%)';
    ph.style.color = 'hsl(' + hue + ', 42%, 74%)';
    ph.setAttribute('aria-hidden', 'true');

  }

      .map(k => folderNode.files[k])
      .sort((a, b) => a.filename.localeCompare(b.filename));
    list.forEach((photo, i) => {
      const thumb = el('button', 'gallery-thumb');
      thumb.type = 'button';
      thumb.style.animationDelay = (i * 0.04).toFixed(2) + 's';
      thumb.setAttribute('aria-label', photo.filename);
      const img = document.createElement('img');
      img.src = photo.src || placeholderImageSrc(photo.filename);
      img.alt = photo.filename;
      img.loading = 'lazy';
      img.draggable = false;
      img.addEventListener('contextmenu', denySave);
      insertSnoopComment(thumb, null);
      thumb.appendChild(img);
      thumb.addEventListener('click', () => openLightbox(list, i));
      grid.appendChild(thumb);
    });
    section.appendChild(grid);
    return section;
  }

  const GALLERY_SECTION_ORDER = ['film', 'digital'];
  function openGallery(path){
    if(appShell.classList.contains('video-gallery-open')) closeVideoGallery();
    galleryBody.innerHTML = '';
    const node = resolveDirNode(path);
    const sectionKeys = Object.keys(node.files).filter(k => node.files[k].type === 'dir').sort((a, b) => {
      const ia = GALLERY_SECTION_ORDER.indexOf(a);
      const ib = GALLERY_SECTION_ORDER.indexOf(b);
      if(ia !== -1 && ib !== -1) return ia - ib;
      if(ia !== -1) return -1;
      if(ib !== -1) return 1;
      return a.localeCompare(b);
    });

    if(sectionKeys.length > 1){
      const jumpRow = el('div', 'gallery-jump-row');
      sectionKeys.slice(1).forEach(key => {
        const jumpBtn = document.createElement('button');
        jumpBtn.type = 'button';
        jumpBtn.className = 'gallery-jump';
        jumpBtn.textContent = 'jump to ' + key + ' ↓';
        jumpBtn.addEventListener('click', () => {
          const target = document.getElementById('gallery-section-' + key);
          if(target) target.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'start' });
        });
        jumpRow.appendChild(jumpBtn);
      });
      galleryBody.appendChild(jumpRow);
    }

    if(sectionKeys.length){
      sectionKeys.forEach(key => {
        galleryBody.appendChild(renderGalleryFolder(key, node.files[key]));
      });
    } else {
      galleryBody.appendChild(renderGalleryFolder(path.split('/').pop(), node));
    }

    appShell.classList.add('gallery-open');
    const title = document.getElementById('galleryTitle');
    title.textContent = '~/' + path;
    if(!REDUCED_MOTION) scrambleInto(title, 0.25, 0.5);
    galleryPane.setAttribute('aria-hidden', 'false');
    currentGalleryPath = path;
  }

  function closeGallery(){
    appShell.classList.remove('gallery-open');
    galleryPane.setAttribute('aria-hidden', 'true');
    closeLightbox();
    currentGalleryPath = null;
    focusInput();
  }

  let currentVideoGalleryPath = null;

  function renderVideoGrid(list){
    const wrap = el('div', 'video-list');
    list.forEach((video, i) => {
      const card = el('div', 'video-card');
      card.style.animationDelay = (i * 0.05).toFixed(2) + 's';
      const thumb = el('button', 'video-thumb');
      thumb.type = 'button';
      thumb.setAttribute('aria-label', 'watch ' + video.title + ' on youtube');
      const img = document.createElement('img');
      img.alt = video.title;
      img.loading = 'lazy';
      img.draggable = false;
      img.addEventListener('contextmenu', denySave);
      img.addEventListener('error', function onThumbErr(){
        img.removeEventListener('error', onThumbErr);
        if(video.thumbFallback && img.src !== video.thumbFallback) img.src = video.thumbFallback;
      }, { once: true });
      img.addEventListener('load', function onThumbLoad(){
        img.removeEventListener('load', onThumbLoad);
        // maxresdefault silently serves a tiny 120x90 grey placeholder (HTTP 200, no
        // error event) when a real HD thumbnail doesn't exist for a video — swap down.
        if(img.naturalWidth && img.naturalWidth <= 120 && video.thumbFallback && img.src !== video.thumbFallback){
          img.src = video.thumbFallback;
        }
      });
      img.src = video.thumb;
      thumb.appendChild(img);
      thumb.addEventListener('click', () => openVideoLink(video));
      card.appendChild(thumb);
      const meta = el('div', 'video-meta');
      meta.appendChild(el('div', 'video-title', esc(video.title)));
      const descBits = [];
      if(video.date) descBits.push(video.date);
      if(video.description) descBits.push(video.description);
      if(descBits.length){
        meta.appendChild(el('div', 'video-desc', esc(descBits.join(' — '))));
      }
      card.appendChild(meta);
      wrap.appendChild(card);
    });
    return wrap;
  }

  const VIDEO_SECTIONS = [
    { key:'music', label:'MUSIC VIDEOS' },
    { key:'events', label:'EVENTS' },
    { key:'weddings', label:'WEDDINGS' },
  ];

  function renderVideoList(node){
    const all = Object.keys(node.files).map(k => node.files[k]);
    const demo = all.filter(v => v.pinned);
    const wrap = el('div', '');

    wrap.appendChild(renderVideoGrid(demo));

    VIDEO_SECTIONS.forEach(({ key, label }) => {
      const inSection = all.filter(v => v.category === key);
      if(!inSection.length) return;
      const section = el('div', '');
      section.id = 'gallery-section-' + key;
      section.appendChild(el('div', 'gallery-section-title', esc(label)));
      section.appendChild(renderVideoGrid(inSection));
      wrap.appendChild(section);
    });

    return wrap;
  }

  function openVideoGallery(path){
    if(appShell.classList.contains('gallery-open')) closeGallery();
    videoGalleryBody.innerHTML = '';
    const node = resolveDirNode(path);
    videoGalleryBody.appendChild(renderVideoList(node));

    appShell.classList.add('video-gallery-open');
    const title = videoGalleryTitle;
    title.textContent = '~/' + path;
    if(!REDUCED_MOTION) scrambleInto(title, 0.25, 0.5);
    videoGalleryPane.setAttribute('aria-hidden', 'false');
    currentVideoGalleryPath = path;
  }

  function closeVideoGallery(){
    appShell.classList.remove('video-gallery-open');
    videoGalleryPane.setAttribute('aria-hidden', 'true');
    currentVideoGalleryPath = null;
    focusInput();
  }

  videoGalleryClose.addEventListener('click', closeVideoGallery);

  galleryClose.addEventListener('click', closeGallery);

  function showPhoto(){
    const photo = currentPhotoList[currentPhotoIndex];
    if(!photo) return;
    lightboxImage.src = photo.src || placeholderImageSrc(photo.filename);
    lightboxImage.alt = photo.filename;
    lightboxImage.classList.remove('zoomed');
    lightboxImage.style.transform = 'scale(1)';
    lightboxImage.style.transformOrigin = 'center center';
    lightboxIsZoomed = false;
    lightboxImageWrap.style.cursor = 'zoom-in';
    if(lightboxImage.previousSibling && lightboxImage.previousSibling.nodeType === Node.COMMENT_NODE){
      lightboxImage.previousSibling.remove();
    }
    insertSnoopComment(lightboxImage.parentNode, lightboxImage);
    lightboxFilename.textContent = photo.filename;
    if(photo.camera){
      lightboxCamera.textContent = 'camera: ' + photo.camera;
      lightboxCamera.style.display = '';
    } else {
      lightboxCamera.textContent = '';
      lightboxCamera.style.display = 'none';
    }
    if(photo.lens){
      lightboxLens.textContent = 'lens: ' + photo.lens;
      lightboxLens.style.display = '';
    } else {
      lightboxLens.textContent = '';
      lightboxLens.style.display = 'none';
    }
    if(photo.film){
      lightboxFilm.textContent = 'film: ' + photo.film;
      lightboxFilm.style.display = '';
    } else {
      lightboxFilm.textContent = '';
      lightboxFilm.style.display = 'none';
    }
    if(photo.format){
      lightboxFormat.textContent = 'format: ' + photo.format;
      lightboxFormat.style.display = '';
    } else {
      lightboxFormat.textContent = '';
      lightboxFormat.style.display = 'none';
    }
    if(photo.artist){
      lightboxArtist.textContent = 'artist: ' + photo.artist;
      lightboxArtist.style.display = '';
    } else {
      lightboxArtist.textContent = '';
      lightboxArtist.style.display = 'none';
    }
    if(photo.medium){
      lightboxMedium.textContent = 'medium: ' + photo.medium;
      lightboxMedium.style.display = '';
    } else {
      lightboxMedium.textContent = '';
      lightboxMedium.style.display = 'none';
    }
    lightboxDesc.textContent = photo.description || '';

    if(!REDUCED_MOTION){
      [lightboxFilename, lightboxCamera, lightboxLens, lightboxFilm, lightboxFormat,
       lightboxArtist, lightboxMedium, lightboxDesc]
        .forEach((elm, i) => scrambleInto(elm, i * 0.1, 0.5));
    }
  }

  function openLightbox(list, index){
    currentPhotoList = list;
    currentPhotoIndex = index;
    showPhoto();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
  }

  function stepPhoto(delta){
    if(!currentPhotoList.length) return;
    currentPhotoIndex = (currentPhotoIndex + delta + currentPhotoList.length) % currentPhotoList.length;
    showPhoto();
  }

  lightboxImage.draggable = false;
  lightboxImage.addEventListener('contextmenu', denySave);

  const LIGHTBOX_ZOOM_SCALE = 2.4;
  let lightboxIsZoomed = false;
  function panZoomFromEvent(e){
    const rect = lightboxImage.getBoundingClientRect();
    if(rect.width === 0 || rect.height === 0) return;
    const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
    lightboxImage.style.transformOrigin = x + '% ' + y + '%';
  }
  lightboxImageWrap.addEventListener('click', (e) => {
    e.stopPropagation();
    if(MQ_COARSE.matches) return; // hover-pan zoom needs a mouse; swipe navigates instead
    lightboxIsZoomed = !lightboxIsZoomed;
    if(lightboxIsZoomed){
      panZoomFromEvent(e);
      lightboxImage.style.transform = 'scale(' + LIGHTBOX_ZOOM_SCALE + ')';
      lightboxImage.classList.add('zoomed');
      lightboxImageWrap.style.cursor = 'zoom-out';
    } else {
      lightboxImage.style.transform = 'scale(1)';
      lightboxImage.classList.remove('zoomed');
      lightboxImageWrap.style.cursor = 'zoom-in';
    }
  });
  lightboxImageWrap.addEventListener('mousemove', (e) => {
    if(!lightboxIsZoomed) return;
    panZoomFromEvent(e);
  });

  lightboxClose.addEventListener('click', closeLightbox);
  let swipeX = null, swipeY = null;
  lightbox.addEventListener('touchstart', (e) => {
    if(e.touches.length !== 1){ swipeX = null; return; }
    swipeX = e.touches[0].clientX;
    swipeY = e.touches[0].clientY;
  }, { passive: true });
  lightbox.addEventListener('touchend', (e) => {
    if(swipeX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - swipeX;
    const dy = t.clientY - swipeY;
    swipeX = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) stepPhoto(dx < 0 ? 1 : -1);
  }, { passive: true });
  lightboxPrev.addEventListener('click', () => stepPhoto(-1));
  lightboxNext.addEventListener('click', () => stepPhoto(1));
  lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowLeft') stepPhoto(-1);
    else if(e.key === 'ArrowRight') stepPhoto(1);
  });

  function doCd(arg){
    if(!arg || arg === '~' || arg === '/'){ cwd = ''; updatePrompt(); return; }
    if(arg === '..'){
      const parts = splitPath(cwd);
      parts.pop();
      cwd = parts.join('/');
      updatePrompt();
      return;
    }
    const path = resolveArgPath(arg);
    if(resolveDirNode(path)){ cwd = path; updatePrompt(); return; }
    printLine('no such directory: ' + arg, 'err');
  }

  function doCat(arg){
    if(!arg){ printLine('usage: cat <file>', 'err'); return; }
    const trimmed = arg.replace(/\/$/, '');
    let path = resolveArgPath(trimmed);
    let node = resolveNode(path);

    if(!node && !trimmed.includes('/')){
      for(const d of ['work', 'journal', 'journal/dreams']){
        const dirNode = resolveDirNode(d);
        if(dirNode && dirNode.files[trimmed]){
          node = dirNode.files[trimmed];
          path = d + '/' + trimmed;
          break;
        }
      }
    }

    if(node && node.type === 'album'){
      printAlbumFile(node, 'cat ' + path);
    } else if(node && node.type === 'link'){
      openLinkFile(node);
    } else if(node && node.type === 'video'){
      openVideoLink(node);
    } else if(node && node.type === 'about'){
      printAboutFile(node, 'cat ' + path);
    } else if(path === 'contact.txt' && node){
      printContactFile(node, 'cat ' + path);
    } else if(node && node.type !== 'dir'){
      const name = splitPath(path).pop();
      printFile(name, node.content, 'cat ' + path);
    } else {
      printLine('no such file: ' + arg, 'err');
    }
  }

  function sequentialReveal(items, stepMs, decodeMs){
    items.forEach(item => {
      item.elm.textContent = item.text;
      item.elm.style.opacity = '0';
    });
    items.forEach((item, i) => {
      const delayMs = i * stepMs;
      setTimeout(() => { item.elm.style.opacity = '1'; }, delayMs);
      scrambleInto(item.elm, delayMs / 1000, decodeMs / 1000);
    });
  }

  function clearOutput(){
    output.innerHTML = '';
    currentPanel = null;
    rootPanelBody = null;
    currentEntry = null;
    panelNavStack = [];
    currentPanelCmd = null;
    closeGallery();
    closeVideoGallery();

    const sentences = [
      'there is nothing.',
      'perhaps you will find your answer upon rebirth.',
      'until then, submit to silence.'
    ];
    const items = sentences.map(text => {
      const lineEl = el('div', 'line dim quote-line');
      output.appendChild(lineEl);
      return { elm: lineEl, text };
    });
    sequentialReveal(items, 6000, 3000);

    const inputRow = document.querySelector('.inputrow');
    if(inputRow) inputRow.classList.add('gone');
    if(mobileDock) mobileDock.classList.add('gone');

    document.querySelectorAll('.topbar > span').forEach(span => {
      let out = '';
      for(const ch of span.textContent){
        out += ch === ' ' ? ' ' : SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
      }
      span.textContent = out;
    });

    try{ location.hash = 'ended'; }catch(e){}
  }

  function runCommand(raw){
    const cmdLine = raw.trim();
    printEcho(cmdLine);
    if(!cmdLine) return;
    history.push(cmdLine);
    histIdx = history.length;

    const parts = cmdLine.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const arg = parts.slice(1).join(' ');

    switch(cmd){
      case 'help': case 'menu': printHelp(); break;
      case 'ls': doLs(arg); break;
      case 'cd': doCd(arg); break;
      case 'cat': case 'open': case 'less': case 'more': doCat(arg); break;
      case 'pwd': printLine(cwd ? '~/' + cwd : '~'); break;
      case 'whoami':
        (async () => {
          try{
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            printLine("you're " + data.ip + ', of course!');
          }catch(e){
            printLine("you're a mystery, apparently.", 'dim');
          }
        })();
        break;
      case 'contact': doCat('contact.txt'); break;
      case 'about': doCat('about.txt'); break;
      case 'work': doLs('work'); break;
      case 'journal': doLs('journal'); break;
      case 'clear': clearOutput(); break;
      case 'sudo': case 'rm': case 'vim': case 'emacs': printLine('no.', 'dim'); break;
      case 'exit': case 'logout': case 'quit':
        printLine("there's no escaping a static site. thanks for stopping by though.", 'dim'); break;
      default:
        printLine("why can't i find you? type 'help' for a list of commands.", 'err');
    }
    focusInput();
  }

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const val = input.value;
      input.value = '';
      runCommand(val);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(histIdx > 0){ histIdx--; input.value = history[histIdx] || ''; }
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(histIdx < history.length){ histIdx++; input.value = history[histIdx] || ''; }
    }
  });

  document.addEventListener('mouseup', (e) => {
    if(e.target && e.target.closest && e.target.closest('input, textarea, select, a, .compose')) return;
    const sel = window.getSelection();
    if(sel && sel.toString().length > 0) return;
    focusInput();
  });

  function scrambleInto(elm, delaySec, durSec){
    const finalText = elm.textContent;
    if(!finalText) return;
    const len = finalText.length;
    elm.textContent = '';
    const start = performance.now() + delaySec * 1000;
    const totalMs = Math.max(durSec * 1000, 1);
    const perCharMs = totalMs / len;
    const settleFrac = 0.55; // portion of each character's slot spent scrambling before it locks in
    function frame(now){
      if(now < start){ requestAnimationFrame(frame); return; }
      const elapsed = now - start;
      if(elapsed >= totalMs){ elm.textContent = finalText; return; }
      const settledCount = Math.floor(elapsed / perCharMs);
      let out = finalText.slice(0, settledCount);
      const ch = finalText[settledCount];
      if(ch !== undefined){
        if(ch === ' ' || ch === '\n'){
          out += ch;
        } else {
          const withinSlot = (elapsed - settledCount * perCharMs) / perCharMs;
          out += (withinSlot >= settleFrac) ? ch : SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
        }
      }
      elm.textContent = out;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function getScrambleTargets(elm){
    if(elm.classList.contains('line')) return [elm];
    if(elm.classList.contains('inputrow')){
      const s = elm.querySelector('.promptlabel');
      return s ? [s] : [];
    }
    const spans = Array.from(elm.querySelectorAll('span')).filter(s => !s.querySelector('span'));
    return spans.length ? spans : [elm];
  }

  function decodeInRows(box, stepSec, durSec){
    if(REDUCED_MOTION) return;
    Array.from(box.children).forEach((row, i) => {
      const delay = i * stepSec;
      row.style.animationDelay = delay.toFixed(2) + 's';
      row.style.animationDuration = durSec.toFixed(2) + 's';
      row.classList.add('boot-flicker');
      getScrambleTargets(row).forEach(t => scrambleInto(t, delay, durSec));
    });
  }

  function flickerElement(elm){
    if(REDUCED_MOTION) return;
    const delay = Math.random() * 0.6;
    const dur = 1.3 + Math.random() * 0.9;
    elm.style.animationDelay = delay.toFixed(2) + 's';
    elm.style.animationDuration = dur.toFixed(2) + 's';
    elm.classList.add('boot-flicker');
    getScrambleTargets(elm).forEach(t => scrambleInto(t, delay, dur));
  }

  function runBootFlicker(){
    const targets = [];
    const topbar = document.querySelector('.topbar');
    if(topbar) targets.push(topbar);
    const intro = document.querySelector('.boot-intro');
    if(intro) intro.querySelectorAll('.line').forEach(l => targets.push(l));
    if(rootPanelBody){
      const panel = rootPanelBody.closest('.panel');
      if(panel){
        const head = panel.querySelector('.panelhead');
        if(head) targets.push(head);
      }
      rootPanelBody.querySelectorAll('.listing > div').forEach(row => targets.push(row));
    }
    const inputRow = document.querySelector('.inputrow');
    if(inputRow) targets.push(inputRow);
    targets.forEach(flickerElement);
  }

  function boot(){
    const intro = el('div', 'entry boot-intro');
    const introRow = el('div', 'boot-intro-row');
    const textCol = el('div', 'boot-intro-text');
    textCol.appendChild(el('div', 'line dim', esc('connected to elijahhalford.tty — session started')));
    textCol.appendChild(el('div', 'line dim', esc(isNarrow()
      ? "video & photo, orlando. tap anything below to get started."
      : "video & photo, orlando. type 'help' to get started.")));
    introRow.appendChild(textCol);
    const logo = document.createElement('img');
    logo.className = 'boot-logo';
    logo.src = LOGO_GIF_DATA_URI;
    logo.alt = '';
    logo.draggable = false;
    logo.addEventListener('contextmenu', denySaveSilent);
    introRow.appendChild(logo);
    intro.appendChild(introRow);
    output.appendChild(intro);
    printRootListing();
    focusInput();
    runBootFlicker();
  }

  function reviveThenBoot(){
    const overlay = el('div', 'revive-overlay');
    const gif = document.createElement('img');
    gif.className = 'revive-gif';
    gif.src = REBIRTH_GIF_DATA_URI;
    gif.alt = '';
    gif.draggable = false;
    overlay.appendChild(gif);
    const msg = el('div', 'line dim');
    msg.textContent = 'very well...';
    msg.style.opacity = '0';
    overlay.appendChild(msg);
    document.body.appendChild(overlay);

    setTimeout(() => { msg.style.opacity = '1'; gif.style.opacity = '0.5'; }, 0);
    scrambleInto(msg, 0, 1);

    setTimeout(() => { location.reload(); }, 1800);
  }

  if(mobileDock){
    mobileDock.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => runCommand(btn.dataset.cmd));
    });
  }
  const onLayoutChange = () => updatePrompt();
  if(MQ_NARROW.addEventListener) MQ_NARROW.addEventListener('change', onLayoutChange);
  else if(MQ_NARROW.addListener) MQ_NARROW.addListener(onLayoutChange);

  function startup(){
    updatePrompt();
    if(location.hash === '#ended'){
      try{ history.replaceState(null, '', location.pathname + location.search); }
      catch(e){ location.hash = ''; }
      reviveThenBoot();
    } else {
      boot();
    }
  }
  startup();
})();
