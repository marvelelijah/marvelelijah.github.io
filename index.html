<style>
  :root{
    --bg:#000000;
    --fg:#D8D8D2;
    --fg-dim:#7A7A73;
    --dir:#8FA88A;
    --media:#C97B52;
    --err:#C97B52;
    --line:#262622;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:calc(15px * var(--ts, 1));
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
  ::selection{ background:var(--fg); color:var(--bg); }
  :focus-visible{ outline:1px solid var(--fg); outline-offset:2px; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  .app-shell{
    height:100vh;
    height:100svh;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }

  .term{
    height:100vh;
    height:100svh;
    display:flex;
    flex-direction:column;
    max-width:840px;
    width:100%;
    flex:none;
    padding:0 20px;
    transition:max-width 0.45s cubic-bezier(.4,0,.2,1);
  }
  .app-shell.gallery-open .term,
  .app-shell.video-gallery-open .term{
    max-width:50vw;
  }

  .gallery-pane{
    flex:none;
    width:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
    transition:width 0.45s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
  }
  .app-shell.gallery-open .gallery-pane{
    width:50vw;
    border-left:1px solid var(--line);
  }
  .video-gallery-pane{
    flex:none;
    width:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
    transition:width 0.45s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
  }
  .app-shell.video-gallery-open .video-gallery-pane{
    width:50vw;
    border-right:1px solid var(--line);
  }
  .galleryhead{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    color:var(--fg-dim);
    border-bottom:1px solid var(--line);
    padding:16px 18px 10px;
    white-space:nowrap;
  }
  .gallerybody{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 18px;
    min-width:340px;
  }
  .gallery-jump-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
  }
  .gallery-jump{
    display:block;
    width:100%;
    text-align:left;
    color:var(--fg-dim);
    border:1px solid var(--line);
    padding:6px 10px;
    background:none;
  }
  .gallery-jump:hover, .gallery-jump:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .gallery-section-title{
    color:var(--dir);
    margin:18px 0 8px;
  }
  .gallery-section-title:first-child{ margin-top:0; }
  .gallery-grid{
    columns:var(--gcols, 2);
    column-gap:12px;
  }
  .gallery-thumb{
    display:block;
    width:100%;
    margin:0 0 12px;
    break-inside:avoid;
    border:1px solid var(--line);
    background:none;
    padding:0;
    overflow:hidden;
    opacity:0;
    animation:thumbIn 0.35s ease forwards;
  }
  .gallery-thumb:hover, .gallery-thumb:focus-visible{ border-color:var(--fg-dim); }
  .gallery-thumb img{
    width:100%; height:auto; display:block;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  @keyframes thumbIn{ to{ opacity:1; } }
  img.blur-up{ opacity:0; transition:opacity 0.35s ease; }
  img.blur-up.is-loaded{ opacity:1; }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:40px;
  }
  .lightbox.open{ display:flex; }
  .lightbox-content{
    display:flex;
    align-items:center;
    gap:24px;
    max-width:1100px;
    max-height:100%;
    width:auto;
  }
  .lightbox-image-wrap{
    flex:0 1 auto;
    display:inline-flex;
    max-width:100%;
    max-height:80vh;
    overflow:hidden;
    border:1px solid var(--line);
    cursor:zoom-in;
  }
  .lightbox-image{
    flex:none;
    max-width:100%;
    max-height:80vh;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    transition:transform 0.15s ease;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  .lightbox-image.zoomed{ transition:none; }
  html.hide-photo-info .lightbox-info{ display:none; }
  .lightbox-info{
    flex:none;
    width:240px;
    color:var(--fg-dim);
    padding-top:4px;
  }
  .lightbox-filename{ color:var(--fg); margin-bottom:10px; word-break:break-word; }
  .lightbox-camera{ margin-bottom:4px; }
  .lightbox-lens{ margin-bottom:4px; }
  .lightbox-film{ margin-bottom:4px; }
  .lightbox-format{ margin-bottom:4px; }
  .lightbox-exposure{ margin-bottom:14px; }
  .lightbox-artist{ margin-bottom:4px; }
  .lightbox-medium{ margin-bottom:14px; }
  .lightbox-desc{ line-height:1.6; }
  .lightbox-close, .lightbox-arrow{
    position:fixed;
    border:1px solid var(--line);
    color:var(--fg-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.4);
  }
  .lightbox-close:hover, .lightbox-arrow:hover,
  .lightbox-close:focus-visible, .lightbox-arrow:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .lightbox-close{ top:20px; right:20px; width:32px; height:32px; font-size:1.1rem; }
  .lightbox-play{
    position:fixed; top:20px; right:62px; height:32px; padding:0 10px;
    border:1px solid var(--line); color:var(--fg-dim); background:rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:6px; font-size:0.85rem;
  }
  .lightbox-play:hover, .lightbox-play:focus-visible, .lightbox-play.on{ color:var(--fg); border-color:var(--fg-dim); }
  .lightbox-play .bar{ position:absolute; left:0; bottom:-1px; height:2px; width:0; background:var(--fg-dim); }
  .lightbox-arrow{ top:50%; transform:translateY(-50%); width:44px; height:44px; font-size:1.4rem; }
  .lightbox-prev{ left:20px; }
  .lightbox-next{ right:20px; }

  @media (max-width: 760px){
    .gallery-pane, .video-gallery-pane{
      position:fixed; top:0; left:0; z-index:40; width:100vw; border:none; background:var(--bg);
      transition:transform 0.4s cubic-bezier(.4,0,.2,1), visibility 0s linear 0.4s;
      visibility:hidden;
    }
    .gallery-pane{ transform:translateX(100%); }
    .video-gallery-pane{ transform:translateX(-100%); }
    .app-shell.gallery-open .gallery-pane,
    .app-shell.video-gallery-open .video-gallery-pane{
      width:100vw; border:none; transform:none; visibility:visible;
      transition:transform 0.4s cubic-bezier(.4,0,.2,1), visibility 0s;
    }
    .gallerybody{ min-width:0; padding:14px 14px calc(24px + env(safe-area-inset-bottom)); }
    .galleryhead{ padding:calc(12px + env(safe-area-inset-top)) 14px 10px; }
    .gallery-grid, .video-list{ column-gap:8px; }
    .gallery-thumb, .video-card{ margin-bottom:8px; }

    .lightbox{
      padding:calc(64px + env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
      align-items:flex-start;
      overflow-y:auto;
      background:#000;
    }
    .lightbox-content{ flex-direction:column; align-items:stretch; gap:14px; width:100%; max-height:none; }
    .lightbox-image-wrap{ max-height:62svh; width:100%; justify-content:center; cursor:default; border:none; }
    .lightbox-image{ max-height:62svh; margin:0 auto; }
    .lightbox-info{ width:100%; padding-top:0; }
    .lightbox-close{ top:calc(12px + env(safe-area-inset-top)); right:12px; width:44px; height:44px; font-size:1.3rem; }
    .lightbox-play{ top:calc(12px + env(safe-area-inset-top)); right:66px; height:44px; padding:0 14px; }
    .lightbox-arrow{
      top:auto; transform:none;
      bottom:calc(16px + env(safe-area-inset-bottom));
      width:64px; height:48px;
    }
    .lightbox-prev{ left:14px; }
    .lightbox-next{ right:14px; }
  }

  .video-list{
    columns:2;
    column-gap:12px;
  }
  .video-card{
    display:block;
    width:100%;
    margin:0 0 12px;
    break-inside:avoid;
    border:1px solid var(--line);
    padding:0;
    overflow:hidden;
    opacity:0;
    animation:thumbIn 0.35s ease forwards;
  }
  .video-thumb{
    display:block;
    width:100%;
    position:relative;
    border:none;
    background:none;
    padding:0;
    overflow:hidden;
  }
  .video-thumb img{
    width:100%; height:auto; display:block;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-touch-callout:none;
  }
  .video-thumb::after{
    content:'▶';
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(0,0,0,0.55);
    border:1px solid var(--fg-dim);
    color:var(--fg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.8rem;
    pointer-events:none;
  }
  .video-thumb:hover::after, .video-thumb:focus-visible::after{
    border-color:var(--fg);
  }
  .video-meta{
    padding:8px 10px 12px;
  }
  .video-title{
    color:var(--fg);
    margin-bottom:4px;
  }
  .video-desc{
    color:var(--fg-dim);
    line-height:1.6;
  }

  .about-header-text{ margin:0 0 1.65em; }
  .about-gif-pin{
    float:right;
    width:128px;
    height:auto;
    margin:0 0 14px 18px;
    border:1px solid var(--line);
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
  }
  @media (max-width: 760px){
    .about-gif-pin{ width:29%; max-width:115px; }
  }

  .tie-accent{
    color:var(--dir);
    cursor:pointer;
    text-decoration:underline dotted;
    text-underline-offset:3px;
  }
  .tie-accent:hover{
    filter:brightness(1.2);
  }

  .boot-intro-row{
    position:relative;
  }
  .boot-intro-text{
    min-width:0;
    padding-right:114px;
  }
  .boot-logo{
    display:block;
    position:absolute;
    top:50%;
    right:0;
    transform:translateY(-50%);
    height:72px;
    width:auto;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none; user-drag:none;
  }

  .topbar{
    flex:none;
    padding:16px 0 10px;
    color:var(--fg-dim);
    font-size:0.82rem;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .handle-link{ cursor:pointer; }
  .handle-link:hover, .handle-link:focus-visible{
    color:var(--fg);
    text-decoration:underline;
  }

  .output{
    flex:1 1 auto;
    overflow-y:auto;
    padding:18px 0;
    padding-bottom:calc(18px + var(--room, 0px));
  }

  /* minimal scrollbars that only show while scrolling */
  .output, .gallerybody, .about-float, .lightbox{
    scrollbar-width:thin;
    scrollbar-color:transparent transparent;
  }
  .output.is-scrolling, .gallerybody.is-scrolling, .about-float.is-scrolling, .lightbox.is-scrolling{
    scrollbar-color:var(--fg-dim) transparent;
  }
  .output::-webkit-scrollbar, .gallerybody::-webkit-scrollbar,
  .about-float::-webkit-scrollbar, .lightbox::-webkit-scrollbar{ width:5px; height:5px; }
  .output::-webkit-scrollbar-track, .gallerybody::-webkit-scrollbar-track,
  .about-float::-webkit-scrollbar-track, .lightbox::-webkit-scrollbar-track{ background:transparent; }
  .output::-webkit-scrollbar-thumb, .gallerybody::-webkit-scrollbar-thumb,
  .about-float::-webkit-scrollbar-thumb, .lightbox::-webkit-scrollbar-thumb{ background:transparent; border-radius:3px; }
  .output.is-scrolling::-webkit-scrollbar-thumb, .gallerybody.is-scrolling::-webkit-scrollbar-thumb,
  .about-float.is-scrolling::-webkit-scrollbar-thumb, .lightbox.is-scrolling::-webkit-scrollbar-thumb{ background:var(--fg-dim); }
  .output::-webkit-scrollbar-button, .gallerybody::-webkit-scrollbar-button{ display:none; }

  .line{
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:2px;
  }
  .line.echo{ margin-top:14px; color:var(--fg); }
  .line.echo .prompt{ color:var(--dir); }
  .line.err{ color:var(--err); }
  .line.dim{ color:var(--fg-dim); }

  .panel{ margin:10px 0 16px; }
  .panelhead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    color:var(--fg-dim);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .panelhead .panelname{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panelhead-actions{ flex:none; display:flex; align-items:center; gap:6px; }
  .closebtn, .backbtn{
    flex:none;
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    color:var(--fg-dim);
    line-height:1;
    font-size:0.85rem;
  }
  .closebtn:hover, .closebtn:focus-visible,
  .backbtn:hover, .backbtn:focus-visible{
    color:var(--fg);
    border-color:var(--fg-dim);
  }
  .panelbody pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-family:inherit;
    font-size:inherit;
  }

  .album-view{
    display:flex;
    gap:20px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .album-cover-link{ flex:none; display:block; }
  .album-cover{
    width:160px;
    height:160px;
    object-fit:cover;
    border:1px solid var(--line);
    display:block;
  }
  .album-meta{
    flex:1;
    min-width:180px;
    padding-top:2px;
  }
  .album-title{
    color:var(--fg);
    font-size:1rem;
    margin-bottom:4px;
  }
  .album-artist{ color:var(--fg-dim); margin-bottom:10px; }
  .album-sub{ color:var(--fg-dim); font-size:0.85em; margin-bottom:14px; }
  .album-link{
    color:var(--dir);
    text-decoration:underline;
  }
  .album-link:hover, .album-link:focus-visible{ color:var(--fg); }
  .album-links{ display:flex; flex-wrap:wrap; gap:6px 16px; }

  .album-facts{ color:var(--fg-dim); font-size:0.85em; margin-bottom:4px; }
  .album-facts b{ color:var(--fg); font-weight:500; }

  .row-thumb{
    width:1.1em;
    height:1.1em;
    object-fit:cover;
    border:1px solid var(--line);
    vertical-align:-0.18em;
    margin-right:8px;
    flex:none;
  }
  .cover-fallback{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    line-height:1;
  }
  .row-thumb.cover-fallback{ font-size:0.55em; }
  .album-cover.cover-fallback{ font-size:2.2rem; }

  .row-icon{
    display:inline-block;
    width:1.3em;
    flex:none;
    text-align:center;
    color:var(--fg-dim);
    margin-right:6px;
  }

  .listing{ display:flex; flex-direction:column; gap:2px; margin:4px 0 8px; }
  .listing button{
    text-align:left;
    color:var(--fg);
    padding:1px 0;
  }
  .listing button:hover, .listing button:focus-visible{ color:var(--fg); text-decoration:underline; }
  .listing .tag-dir{ color:var(--dir); }
  .listing .tag-media{ color:var(--media); }
  .listing .kind{ color:var(--fg-dim); margin-left:10px; font-size:0.85em; }


  .inputrow.gone{ display:none; }
  .inputrow{
    flex:none;
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:12px 0 18px;
    border-top:1px solid var(--line);
  }
  .promptlabel{ color:var(--dir); white-space:pre; padding-top:2px; }
  .inputrow input{
    flex:1;
    background:none;
    border:none;
    color:var(--fg);
    font:inherit;
    padding-top:2px;
  }
  .inputrow input:focus{ outline:none; }

  @media (max-width:600px){
    .term{ padding:0 14px; }
    body{ font-size:14px; }
  }

  .flash{
    position:fixed; inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:50;
  }
  .flash.on{ animation:shutter 160ms ease-out; }
  @keyframes shutter{
    0%{ opacity:0; }
    18%{ opacity:1; }
    100%{ opacity:0; }
  }

  .boot-flicker{
    animation-name:flicker;
    animation-timing-function:linear;
    animation-fill-mode:both;
    animation-iteration-count:1;
  }
  @keyframes flicker{
    0%{ opacity:0; }
    4%{ opacity:1; }
    8%{ opacity:0.15; }
    12%{ opacity:1; }
    18%{ opacity:0.08; }
    24%{ opacity:1; }
    30%{ opacity:0.3; }
    38%{ opacity:1; }
    46%{ opacity:0.12; }
    54%{ opacity:1; }
    64%{ opacity:0.4; }
    72%{ opacity:1; }
    100%{ opacity:1; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .noscript-card{ max-width:640px; margin:0 auto; padding:40px 20px; line-height:1.7; }
  .noscript-card p{ margin-bottom:14px; }
  .noscript-card a{ color:var(--fg); }

  /* ---- contact: links + compose ---- */
  .contact-link{ color:var(--dir); text-decoration:underline; text-underline-offset:3px; }
  .contact-link:hover, .contact-link:focus-visible{ color:var(--fg); }

  .compose{
    margin-top:20px;
    padding-top:14px;
    border-top:1px dashed var(--line);
    max-width:600px;
  }

      if(!navigatingBack && currentPanelCmd){
        panelNavStack.push(currentPanelCmd);
      }
      holdSpace(currentPanel);
      currentPanel.remove();
      currentPanel = null;
    }
    navigatingBack = false;
    currentPanelCmd = originCmd || null;
    const panel = el('div', 'panel');
    const head = el('div', 'panelhead');
    head.appendChild(el('span', 'panelname', esc(label)));
    const actions = el('div', 'panelhead-actions');
    if(panelNavStack.length > 0){
      const backBtn = el('button', 'backbtn', '←');
      backBtn.type = 'button';
      backBtn.setAttribute('aria-label', 'back to previous view');
      backBtn.addEventListener('click', () => {
        const prevCmd = panelNavStack.pop();
        if(prevCmd){
          navigatingBack = true;
          runCommand(prevCmd);
        }
      });
      actions.appendChild(backBtn);
    }
    if(closable){
      const closeBtn = el('button', 'closebtn', '×');
      closeBtn.type = 'button';
      closeBtn.setAttribute('aria-label', 'close ' + label);
      closeBtn.addEventListener('click', () => {
        if(currentPanel === panel) currentPanel = null;
        panelNavStack = [];
        currentPanelCmd = null;
        collapseAway(panel);
        if(currentEntry && currentEntry === panel.previousElementSibling){
          collapseAway(currentEntry); currentEntry = null;
        }
        focusInput();
      });
      actions.appendChild(closeBtn);
    }
    head.appendChild(actions);
    panel.appendChild(head);
    const body = el('div', 'panelbody');
    panel.appendChild(body);
    output.appendChild(panel);
    currentPanel = panel;
    if(!REDUCED_MOTION){
      panel.animate([{ opacity:0, transform:'translateY(6px)' }, { opacity:1, transform:'none' }],
        { duration:260, easing:'cubic-bezier(.2,.7,.2,1)' });
    }
    scrollToPanel(panel);
    return body;
  }

  // shrink an element's height to nothing while fading it, then remove it
  function collapseAway(elm){
    if(REDUCED_MOTION || !elm.isConnected){ elm.remove(); return; }
    const h = elm.offsetHeight;
    const cs = getComputedStyle(elm);
    elm.style.overflow = 'hidden';
    elm.style.pointerEvents = 'none';
    const a = elm.animate([
      { height:h + 'px', opacity:1, marginTop:cs.marginTop, marginBottom:cs.marginBottom },
      { height:'0px', opacity:0, marginTop:'0px', marginBottom:'0px' }
    ], { duration:280, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
    a.finished.then(() => elm.remove()).catch(() => elm.remove());
  }

  function printFile(name, content, originCmd){
    const body = printPanel(name, true, originCmd);
    body.appendChild(el('pre', '', esc(content)));
  }

  const CONTACT_EMAIL_FALLBACK = 'elijah.m.halford@gmail.com';
  const COMPOSE_TYPES = ['wedding', 'event', 'music video', 'photo', 'something else'];

  function contactLink(text, href, external){
    const a = document.createElement('a');
    a.className = 'contact-link';
    a.href = href;
    a.textContent = text;
    if(external){ a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    return a;
  }

  // Renders contact.txt with its email / handles / youtube turned into links.
  function renderContactText(pre, text){
    const re = /([\w.+-]+@[\w-]+\.[\w.-]+)|(^|\s)(@[\w.]+)|(youtube\.com\/\S+)/gm;
    let last = 0, m;
    while((m = re.exec(text))){
      if(m[1]){
        pre.appendChild(document.createTextNode(text.slice(last, m.index)));
        pre.appendChild(contactLink(m[1], 'mailto:' + m[1], false));
        last = m.index + m[1].length;
      } else if(m[3]){
        const start = m.index + m[2].length;
        pre.appendChild(document.createTextNode(text.slice(last, start)));
        pre.appendChild(contactLink(m[3], 'https://www.instagram.com/' + m[3].slice(1) + '/', true));
        last = start + m[3].length;
      } else if(m[4]){
        pre.appendChild(document.createTextNode(text.slice(last, m.index)));
        pre.appendChild(contactLink(m[4], 'https://' + m[4], true));
        last = m.index + m[4].length;
      }
    }
    pre.appendChild(document.createTextNode(text.slice(last)));
  }

  function buildComposeForm(toAddr, withTitle){
    const form = el('form', 'compose');

    if(withTitle) form.appendChild(el('div', 'compose-title', esc('── write to me ──')));

    let chosenType = '';
    const typeRow = el('div', 'compose-row');
    typeRow.appendChild(el('span', 'compose-label', 're'));
    const types = el('div', 'compose-types');
    COMPOSE_TYPES.forEach(t => {
      const b = el('button', 'compose-type', esc(t));
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        types.querySelectorAll('.compose-type').forEach(x => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        chosenType = on ? t : '';
      });
      types.appendChild(b);
    });
    typeRow.appendChild(types);
    form.appendChild(typeRow);

    function field(label, tag, attrs){
      const row = el('label', 'compose-row');
      row.appendChild(el('span', 'compose-label', esc(label)));
      const f = document.createElement(tag);
      Object.keys(attrs).forEach(k => f.setAttribute(k, attrs[k]));
      row.appendChild(f);
      form.appendChild(row);
      return f;
    }
    const nameIn = field('name', 'input', { type:'text', autocomplete:'name', placeholder:'who’s writing', maxlength:'80' });
    const subjIn = field('subject', 'input', { type:'text', autocomplete:'off', placeholder:'optional', maxlength:'120' });
    const msgIn  = field('message', 'textarea', { rows:'5', placeholder:'dates, location, what you have in mind…' });

    const actions = el('div', 'compose-actions');
    const send = el('button', 'compose-send', esc('send ↗'));
    send.type = 'submit';
    actions.appendChild(send);
    const status = el('span', 'compose-status', esc('opens your mail app'));
    actions.appendChild(status);
    form.appendChild(actions);

    msgIn.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); form.requestSubmit ? form.requestSubmit() : send.click(); }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameIn.value.trim();

        status.textContent = 'write something first.';
        status.classList.add('err');
        msgIn.focus();

      let subject = subjIn.value.trim();

      const bodyText = msg + (name ? '\n\n— ' + name : '') + '\n\n(sent from elijahhalford.tty)';
      const href = 'mailto:' + toAddr + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(bodyText);
      status.textContent = 'opening your mail app…';
      window.location.href = href;
    });

    return form;
  }

    const m = node.content.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
    return m ? m[0] : CONTACT_EMAIL_FALLBACK;

  function printContactFile(node, originCmd){

  // each file owns a group of windows: opening it again closes that group only
  function toggleFloatGroup(group, makeSpecs){
    const mine = floatWins.filter(w => w.group === group && w.mode !== 'closing');
    if(mine.length){
      mine.forEach((w, i) => setTimeout(() => closeWin(w, true), i * 120));
      return;
    }
    makeSpecs().forEach((spec, i) => {
      const w = createFloatWin(spec, spec.content);
      w.group = group;
      setTimeout(() => openWin(w), i * 260);
    });
  }

  /* ---------- floating windows ---------- */
  const CONTACT_WIN_SPECS = [
    { key:'socials', title:'socials', width:400 },
    { key:'mail', title:'write to me', width:460 },
  ];
  let floatWins = [];
  let floatLayer = null;
  let floatRAF = null;
  let floatLastT = 0;
  let floatZ = 1;
  const TOP_LINE = 'inset(0 0 calc(100% - 1px) 0)';
  const FULL = 'inset(0 0 0 0)';

  function ensureFloatLayer(){
    if(!floatLayer){
      floatLayer = el('div', 'float-layer');
      document.body.appendChild(floatLayer);
    }
    return floatLayer;
  }

  function placeAt(w){ w.el.style.transform = 'translate(' + w.x.toFixed(2) + 'px,' + w.y.toFixed(2) + 'px)'; }

  function anim(elm, frames, opts){
    if(REDUCED_MOTION) return Promise.resolve();
    return elm.animate(frames, Object.assign({ fill:'forwards' }, opts)).finished.catch(() => {});
  }
  function clearAnims(elm){ elm.getAnimations().forEach(a => a.cancel()); }

  function startFloatLoop(){
    if(!floatRAF){
      floatLastT = performance.now();
      floatRAF = requestAnimationFrame(floatTick);
    }
  }

  function removeWin(w){
    w.el.remove();
    floatWins = floatWins.filter(x => x !== w);
  }

  // closing plays the opening backwards: the window rolls up into its top edge, the line retracts
  async function closeWin(w, animate){
    if(w.mode === 'closing') return;
    w.mode = 'closing';
    w.el.classList.remove('dragging');
    if(!animate || REDUCED_MOTION){ removeWin(w); return; }
    clearAnims(w.el);
    w.el.style.clipPath = FULL;
    await anim(w.el, [{ clipPath: FULL }, { clipPath: TOP_LINE }], { duration:360, easing:'cubic-bezier(.6,0,.8,.4)' });
    const seed = el('div', 'float-seed');
    seed.style.transform = 'scaleX(1)';
    w.el.appendChild(seed);
    await anim(seed, [{ transform:'scaleX(1)' }, { transform:'scaleX(0)' }], { duration:260, easing:'cubic-bezier(.6,0,.8,.4)' });
    removeWin(w);
  }

  function closeAllFloatWins(animate){
    floatWins.slice().forEach((w, i) => {
      if(animate) setTimeout(() => closeWin(w, true), i * 120);
      else removeWin(w);
    });
  }

  function createFloatWin(spec, content){
    const win = el('div', 'float-win');
    win.style.width = Math.min(spec.width, window.innerWidth - 40) + 'px';
    win.setAttribute('role', 'dialog');
    win.setAttribute('aria-label', spec.title);
    const bar = el('div', 'float-bar');
    const titleEl = el('span', '', esc(spec.title));
    bar.appendChild(titleEl);
    const x = el('button', 'closebtn', '×');
    x.type = 'button';
    x.setAttribute('aria-label', 'close ' + spec.title);
    bar.appendChild(x);
    const body = el('div', 'float-body');
    body.appendChild(content);
    win.appendChild(bar);
    win.appendChild(body);

    const w = {
      key: spec.key, el: win, bar, body, titleEl,
      mode: 'new', x: 0, y: 0, vx: 0, vy: 0,
      cruise: 22 + Math.random() * 16,
      speedF: 0, hover: false, ignoreHover: false,
      samples: [], offX: 0, offY: 0,
    };
    floatWins.push(w);

    x.addEventListener('click', () => closeWin(w, true));
    win.addEventListener('mouseenter', () => { if(!w.ignoreHover) w.hover = true; });
    win.addEventListener('mouseleave', () => { w.hover = false; w.ignoreHover = false; });
    win.addEventListener('mousedown', () => { win.style.zIndex = ++floatZ; });
    attachDrag(w);
    return w;
  }

  // opening: a line draws across at a random spot, then the window unrolls downward from it
  function openWin(w){
    if(w.mode !== 'new') return;
    ensureFloatLayer().appendChild(w.el);
    w.el.style.zIndex = ++floatZ;
    const W = window.innerWidth, H = window.innerHeight;
    w.x = Math.random() * Math.max(0, W - w.el.offsetWidth);
    w.y = Math.random() * Math.max(0, H - w.el.offsetHeight);
    placeAt(w);
    const ang = Math.random() * Math.PI * 2;
    w.vx = Math.cos(ang) * w.cruise;
    w.vy = Math.sin(ang) * w.cruise;
    w.speedF = 0;
    w.mode = 'anim';
    startFloatLoop();
    if(REDUCED_MOTION){ w.mode = 'floating'; return; }
    w.el.style.clipPath = TOP_LINE;
    const seed = el('div', 'float-seed');
    w.el.appendChild(seed);
    anim(seed, [{ transform:'scaleX(0)' }, { transform:'scaleX(1)' }], { duration:380, easing:'cubic-bezier(.4,0,.2,1)' })
      .then(() => {
        if(w.mode !== 'anim') return;
        anim(seed, [{ opacity:1 }, { opacity:0 }], { duration:400 }).then(() => seed.remove());
        decodeText(w.body, 0.05, 0.85);
        scrambleInto(w.titleEl, 0.05, 0.5);
        return anim(w.el, [{ clipPath: TOP_LINE }, { clipPath: FULL }], { duration:620, easing:'cubic-bezier(.2,.7,.2,1)' });
      })
      .then(() => {
        if(w.mode !== 'anim') return;
        clearAnims(w.el);
        w.el.style.clipPath = '';
        w.mode = 'floating';
      });
  }

  /* drag by the title bar; letting go throws the window with the speed it was moving */
  function attachDrag(w){
    const bar = w.bar;
    bar.addEventListener('pointerdown', (e) => {
      if(e.button !== 0 || e.target.closest('.closebtn')) return;
      if(w.mode !== 'floating') return;
      e.preventDefault();
      w.mode = 'drag';
      w.el.classList.add('dragging');
      w.el.style.zIndex = ++floatZ;
      document.body.classList.add('is-dragging');
      w.offX = e.clientX - w.x;
      w.offY = e.clientY - w.y;
      w.samples = [{ t: performance.now(), x: e.clientX, y: e.clientY }];
      try{ bar.setPointerCapture(e.pointerId); }catch(err){}
    });
    bar.addEventListener('pointermove', (e) => {
      if(w.mode !== 'drag') return;
      const W = window.innerWidth, H = window.innerHeight;
      w.x = Math.max(0, Math.min(W - w.el.offsetWidth, e.clientX - w.offX));
      w.y = Math.max(0, Math.min(H - w.el.offsetHeight, e.clientY - w.offY));
      placeAt(w);
      const now = performance.now();
      w.samples.push({ t: now, x: e.clientX, y: e.clientY });
      while(w.samples.length > 2 && now - w.samples[0].t > 90) w.samples.shift();
    });
    const release = () => {
      if(w.mode !== 'drag') return;
      w.el.classList.remove('dragging');
      document.body.classList.remove('is-dragging');
      const now = performance.now();
      const a = w.samples[0], b = w.samples[w.samples.length - 1];
      let vx = 0, vy = 0;
      if(a && b && now - b.t < 70){
        const dt = (b.t - a.t) / 1000;
        if(dt > 0.008){ vx = (b.x - a.x) / dt; vy = (b.y - a.y) / dt; }
      }
      let sp = Math.hypot(vx, vy);
      const MAX = 2600;
      if(sp > MAX){ vx *= MAX / sp; vy *= MAX / sp; sp = MAX; }
      if(sp > w.cruise * 3){
        // thrown: fly off, bounce, and bleed speed back down to a drift
        w.vx = vx; w.vy = vy;
        w.speedF = 1;
        w.hover = false;
        w.ignoreHover = true;
      } else {
        // just placed: rest under the cursor, then resume the old drift
        const cur = Math.hypot(w.vx, w.vy) || 1;
        w.vx = w.vx / cur * w.cruise;
        w.vy = w.vy / cur * w.cruise;
        w.speedF = 0;
      }
      w.mode = 'floating';
      startFloatLoop();
    };
    bar.addEventListener('pointerup', release);
    bar.addEventListener('pointercancel', release);
  }

  // how the pop-outs move: 'drift' (default), 'gravity', 'antigravity', 'magnet'
  let floatPhysics = 'drift';
  let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; }, { passive: true });
  const G_DEFAULT = 1400, BOUNCE_DEFAULT = 0.5;
  let G = G_DEFAULT;           // gravity strength, px / s^2 (settings slider)
  let BOUNCE = BOUNCE_DEFAULT; // how much speed survives a bounce (settings slider)

  // a window's "mass" from its area: ~1 for a typical pop-out, up to ~2.2 for the biggest
  const MASS_REF_AREA = 420 * 300;
  function winMass(ww, hh){
    return Math.max(0.55, Math.min(2.2, Math.sqrt((ww * hh) / MASS_REF_AREA)));
  }

  function floatTick(t){
    const dt = Math.min(0.05, (t - floatLastT) / 1000);
    floatLastT = t;
    const W = window.innerWidth, H = window.innerHeight;
    floatWins.forEach(w => {
      if(w.mode !== 'floating') return;
      if(floatPhysics === 'still') return; // windows stay exactly where they are
      // hovering (or typing inside) eases the window to a stop; leaving lets it move again
      const holding = (w.hover && !w.ignoreHover) || w.el.contains(document.activeElement);
      const target = holding ? 0 : 1;
      const rate = holding ? 5 : 0.9;
      w.speedF += (target - w.speedF) * Math.min(1, dt * rate);
      if(REDUCED_MOTION) w.speedF = 0;
      const ww = w.el.offsetWidth, hh = w.el.offsetHeight;
      let sp = Math.hypot(w.vx, w.vy);
      let damp = 1;
      if(floatPhysics === 'drift'){
        // a thrown window loses speed until it is back to its lazy cruising pace
        if(sp > w.cruise){
          const ns = Math.max(w.cruise, sp * Math.exp(-0.85 * dt));
          w.vx *= ns / sp; w.vy *= ns / sp; sp = ns;
        } else if(sp < w.cruise * 0.5){
          const ang = Math.random() * Math.PI * 2;
          w.vx = Math.cos(ang) * w.cruise; w.vy = Math.sin(ang) * w.cruise;
        }
        damp = sp > w.cruise * 1.5 ? 0.82 : 1;
      } else if(floatPhysics === 'gravity' || floatPhysics === 'antigravity'){
        // heavier (bigger) windows are pulled harder
        if(w.speedF > 0.05) w.vy += (floatPhysics === 'gravity' ? G : -G) * winMass(ww, hh) * dt;
        const floor = floatPhysics === 'gravity' ? (w.y + hh >= H - 0.5) : (w.y <= 0.5);
        if(floor){ w.vx *= Math.exp(-2.5 * dt); }
        damp = BOUNCE;
      } else if(floatPhysics === 'magnet'){
        const dx = mouseX - (w.x + ww / 2), dy = mouseY - (w.y + hh / 2);
        const d = Math.hypot(dx, dy) || 1;
        // the same pull moves a heavy window less
        const m = winMass(ww, hh);
        w.vx += dx / d * 900 / m * dt;
        w.vy += dy / d * 900 / m * dt;
        w.vx *= Math.exp(-1.2 * dt); w.vy *= Math.exp(-1.2 * dt);
        damp = 0.7;
      }
      w.x += w.vx * w.speedF * dt;
      w.y += w.vy * w.speedF * dt;
      if(ww >= W){ w.x = 0; }
      else if(w.x < 0){ w.x = 0; w.vx = Math.abs(w.vx) * damp; }
      else if(w.x + ww > W){ w.x = W - ww; w.vx = -Math.abs(w.vx) * damp; }
      if(hh >= H){ w.y = 0; }
      else if(w.y < 0){ w.y = 0; w.vy = Math.abs(w.vy) * damp; if(Math.abs(w.vy) < 60 && floatPhysics === 'antigravity') w.vy = 0; }
      else if(w.y + hh > H){ w.y = H - hh; w.vy = -Math.abs(w.vy) * damp; if(Math.abs(w.vy) < 60 && floatPhysics === 'gravity') w.vy = 0; }
      placeAt(w);
    });
    floatRAF = floatWins.length ? requestAnimationFrame(floatTick) : null;
  }

  /* ---------- decode: scramble every text node in place (keeps links/spans intact) ---------- */
  function scrambleTextNode(node, delaySec, durSec){
    const finalText = node.nodeValue;
    const len = finalText.length;
    if(!len) return;
    node.nodeValue = '';
    const start = performance.now() + delaySec * 1000;
    const totalMs = Math.max(durSec * 1000, 1);
    const perCharMs = totalMs / len;
    function frame(now){
      if(now < start){ requestAnimationFrame(frame); return; }
      const elapsed = now - start;
      if(elapsed >= totalMs){ node.nodeValue = finalText; return; }
      const settled = Math.floor(elapsed / perCharMs);
      let out = finalText.slice(0, settled);
      const ch = finalText[settled];
      if(ch !== undefined){
        if(ch === ' ' || ch === '\n') out += ch;
        else {
          const within = (elapsed - settled * perCharMs) / perCharMs;
          out += within >= 0.55 ? ch : SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
        }
      }
      node.nodeValue = out;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function decodeText(root, delaySec, durSec){
    if(REDUCED_MOTION) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        if(n.parentNode && n.parentNode.closest && n.parentNode.closest('textarea, script, style')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => scrambleTextNode(n, delaySec, durSec));
  }

  function printAboutFile(node, originCmd){
    if(usePopouts()){
      toggleFloatGroup('about', () => [{ key:'about', title:'about.txt', width:680, content: buildAboutContent(node) }]);
      return;
    }
    const body = printPanel('about.txt', true, originCmd);
    fillAbout(body, node);
    decodeText(body, 0.05, 1.1);

  function buildAboutContent(node){
    const box = el('div', 'about-float');
    fillAbout(box, node);
    return box;
  }

  function fillAbout(body, node){
    if(node.gif){
      const img = document.createElement('img');
      img.className = 'about-gif-pin';
      img.src = node.gif;
      img.alt = '';
      img.draggable = false;
      img.addEventListener('contextmenu', denySaveSilent);
      body.appendChild(img);
    }
    body.appendChild(el('pre', 'about-header-text', esc(node.header)));
    const bodyPre = document.createElement('pre');
    renderAboutBody(bodyPre, node.body);
    body.appendChild(bodyPre);
  }

  function renderAboutBody(pre, text){
    const re = /\btie\b/;
    const m = text.match(re);
    if(!m){ pre.textContent = text; return; }
    const idx = m.index;
    pre.appendChild(document.createTextNode(text.slice(0, idx)));
    const span = document.createElement('span');
    span.className = 'tie-accent';
    span.textContent = m[0];
    span.title = 'hm.';
    span.addEventListener('click', randomizeAccents);
    pre.appendChild(span);
    pre.appendChild(document.createTextNode(text.slice(idx + m[0].length)));

  function randomizeAccents(){

  function hashHue(str){
    let h = 0;
    for(let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) % 360; }
    return h < 0 ? h + 360 : h;
  }

  function initialsFor(name){
    const words = name.replace(/[().,]/g, '').split(/\s+/).filter(Boolean);
    if(words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function swapToCoverFallback(imgEl, seedText){
    const hue = hashHue(seedText);
    const ph = document.createElement('span');
    ph.className = imgEl.className + ' cover-fallback';

    ph.style.color = 'hsl(' + hue + ', 42%, 74%)';
    ph.textContent = initialsFor(seedText);

    if(imgEl.parentNode) imgEl.replaceWith(ph);

  function printDirListing(pathStr){

    const box = el('div', 'listing');
    const isMusicDir = (pathStr === 'journal/music');
    let entries = Object.keys(node.files);

      entries = entries.sort((a, b) => node.files[a].year - node.files[b].year);
    }
    entries.forEach(key => {
      const f = node.files[key];
      let name = key, cmd, kind, tagCls, thumbEl = null;
      let isEmpty = false;
      if(f.type === 'dir'){
        const count = Object.keys(f.files).length;
        name = key + '/';
        kind = 'dir · ' + count + ' item' + (count === 1 ? '' : 's');
        if(count === 0){ kind = 'coming soon...'; isEmpty = true; }
        cmd = 'ls ' + pathStr + '/' + key;
        tagCls = 'tag-dir';
      } else if(f.type === 'album'){
        name = f.title;
        kind = f.artist + ' · ' + f.year + ' · ' + f.category;
        cmd = 'cat ' + pathStr + '/' + key;
        tagCls = tagFor(f);
        thumbEl = makeRowThumb(f.title, f.cover);
      } else if(f.type === 'post'){
        name = f.title;
        kind = postDateLabel(f.date) || 'post';
        cmd = 'cat ' + pathStr + '/' + key;
        tagCls = '';
      } else if(f.type === 'link'){
        name = f.title;
        kind = f.author + ' · ' + f.category;
        cmd = 'cat ' + pathStr + '/' + key;
        tagCls = tagFor(f);
        thumbEl = makeRowIcon(f.kind);
      } else {
        kind = f.ext === 'mov' ? 'video' : (f.ext === 'jpg' ? 'image' : 'text');
        cmd = 'cat ' + pathStr + '/' + key;
        tagCls = tagFor(f);
      }
      const row = rowButton(name, cmd, tagCls, kind, thumbEl);
      if(isEmpty) row.classList.add('is-empty');

  let photoOrder = 'shuffle';
  function orderPhotos(list){
    if(photoOrder === 'newest') return list.slice().sort((a, b) => (b.sortKey || 0) - (a.sortKey || 0));
    if(photoOrder === 'oldest') return list.slice().sort((a, b) => (a.sortKey || 0) - (b.sortKey || 0));
    return shuffled(list);
  }

  function shuffled(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

      img.draggable = false;
      img.addEventListener('contextmenu', denySave);
      img.addEventListener('error', function onThumbErr(){
        img.removeEventListener('error', onThumbErr);
        if(video.thumbFallback && img.src !== video.thumbFallback) img.src = video.thumbFallback;
      }, { once: true });
      img.addEventListener('load', function onThumbLoad(){
        img.removeEventListener('load', onThumbLoad);
        // maxresdefault silently serves a tiny 120x90 grey placeholder (HTTP 200, no
        // error event) when a real HD thumbnail doesn't exist for a video — swap down.
        if(img.naturalWidth && img.naturalWidth <= 120 && video.thumbFallback && img.src !== video.thumbFallback){
          img.src = video.thumbFallback;
        }
      });
      img.src = video.thumb;
      thumb.appendChild(img);
      thumb.addEventListener('click', () => openVideoLink(video));
      card.appendChild(thumb);
      const meta = el('div', 'video-meta');
      meta.appendChild(el('div', 'video-title', esc(video.title)));
      const descBits = [];

        meta.appendChild(el('div', 'video-desc', esc(descBits.join(' — '))));

      card.appendChild(meta);
      wrap.appendChild(card);
    });

  }

  function doCd(arg){
    if(!arg || arg === '~' || arg === '/'){ cwd = ''; updatePrompt(); return; }
    if(arg === '..'){
      const parts = splitPath(cwd);
      parts.pop();
      cwd = parts.join('/');
      updatePrompt();
      return;
    }
    const path = resolveArgPath(arg);
    if(resolveDirNode(path)){ cwd = path; updatePrompt(); return; }
    printLine('no such directory: ' + arg, 'err');
  }

  function doCat(arg){
    if(!arg){ printLine('usage: cat <file>', 'err'); return; }
    const trimmed = arg.replace(/\/$/, '');
    let path = resolveArgPath(trimmed);
    let node = resolveNode(path);

    if(!node && !trimmed.includes('/')){
      for(const d of ['work', 'journal', 'journal/dreams']){
        const dirNode = resolveDirNode(d);
        if(dirNode && dirNode.files[trimmed]){
          node = dirNode.files[trimmed];
          path = d + '/' + trimmed;
          break;
        }
      }
    }

    if(node && node.type === 'album'){
      printAlbumFile(node, 'cat ' + path);
    } else if(node && node.type === 'post'){
      printPostFile(node, 'cat ' + path);
    } else if(node && node.type === 'link'){
      openLinkFile(node);
    } else if(node && node.type === 'video'){
      openVideoLink(node);
    } else if(node && node.type === 'about'){
      printAboutFile(node, 'cat ' + path);
    } else if(path === 'contact.txt' && node){
      printContactFile(node, 'cat ' + path);
    } else if(path === 'work/equipment.txt' && node && usePopouts()){
      toggleFloatGroup('equipment', () => [{ key:'equipment', title:'equipment.txt', width:470, content: el('pre', '', esc(node.content)) }]);
    } else if(node && node.type !== 'dir'){
      const name = splitPath(path).pop();
      printFile(name, node.content, 'cat ' + path);
    } else {
      printLine('no such file: ' + arg, 'err');
    }
  }

      sliders = [
        settingsSlider('gravity', 200, 4000, 50, () => G, v => { G = v; }, v => (v / G_DEFAULT).toFixed(1) + '×', G_DEFAULT),
        settingsSlider('bounce', 0, 0.95, 0.01, () => BOUNCE, v => { BOUNCE = v; }, v => Math.round(v * 100) + '%', BOUNCE_DEFAULT),
      ];
      sliders.forEach(sl => physWin.appendChild(sl.row));
      physWin.appendChild(el('div', 'set-note', esc('open about.txt, contact.txt or work/equipment.txt to see the pop-outs.')));
      colA.appendChild(physWin);
    }
    wrap.appendChild(drop);

    btn.addEventListener('click', () => {
      settingsOpen = !settingsOpen;
      applySettingsOpen();
      if(settingsOpen) setTimeout(() => {
        const r = wrap.getBoundingClientRect(), o = output.getBoundingClientRect();
        if(r.bottom > o.bottom) smoothScrollOutput(output.scrollTop + (r.bottom - o.bottom) + 12);
      }, REDUCED_MOTION ? 0 : 380);
    });

    settingsEls = { wrap, btn, chev, drop, fmtMap, physMap, sliders, a11yBtn, tsVal, colMap, orderMap, infoMap, speedMap };
    applySettingsOpen();
    refreshSettings();
    return wrap;
  }

  function applySettingsOpen(){
    if(!settingsEls) return;
    settingsEls.btn.setAttribute('aria-expanded', settingsOpen ? 'true' : 'false');
    settingsEls.wrap.classList.toggle('is-open', settingsOpen);
    settingsEls.drop.classList.toggle('open', settingsOpen);
    if(settingsOpen) settingsEls.drop.removeAttribute('inert'); else settingsEls.drop.setAttribute('inert', '');
    settingsEls.drop.setAttribute('aria-hidden', settingsOpen ? 'false' : 'true');
  }

  function refreshSettings(){
    savePrefs();
    if(!settingsEls) return;
    settingsEls.tsVal.textContent = Math.round(textScale * 100) + '%';
    const mark = (map, cur) => map.forEach(({ val, b }) => {
      const on = val === cur;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    mark(settingsEls.orderMap, photoOrder);
    mark(settingsEls.infoMap, showPhotoInfo);
    mark(settingsEls.speedMap, slideSpeed);
    settingsEls.colMap.forEach(({ n, b }) => {
      const on = currentCols() === n;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    const body = document.body.classList, html = document.documentElement.classList;
    settingsEls.fmtMap.forEach(({ o, b }) => {
      const on = o.kind === 'theme' ? body.contains('theme-' + o.name) : html.contains('fx-' + o.name);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    settingsEls.physMap.forEach(({ o, b }) => {
      const on = floatPhysics === o.mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    settingsEls.sliders.forEach(sl => sl.sync());
    settingsEls.a11yBtn.classList.toggle('on', simpleMode);
    settingsEls.a11yBtn.setAttribute('aria-pressed', simpleMode ? 'true' : 'false');
  }

  /* ---------- view prefs: text size + gallery columns ---------- */
  const TS_STEPS = [0.85, 1, 1.15, 1.3, 1.5];
  let textScale = 1;
  function setTextScale(v, quiet){
    textScale = v;
    if(v === 1) document.documentElement.style.removeProperty('--ts');
    else document.documentElement.style.setProperty('--ts', String(v));
    if(!quiet) refreshSettings();
  }
  function stepTextScale(dir){
    let i = TS_STEPS.indexOf(textScale);
    if(i < 0) i = 1;
    setTextScale(TS_STEPS[Math.max(0, Math.min(TS_STEPS.length - 1, i + dir))]);
  }
  let galleryCols = null; // null = layout default (2)
  function colOptions(){ return isNarrow() ? [1, 2, 3] : [2, 3, 4]; }
  function currentCols(){ return galleryCols || 2; }
  function setCols(n, quiet){
    galleryCols = n === 2 ? null : n;
    if(galleryCols) document.documentElement.style.setProperty('--gcols', String(n));
    else document.documentElement.style.removeProperty('--gcols');
    if(!quiet) refreshSettings();
  }

  /* ---------- remembered settings (this browser only) ---------- */
  const PREFS_KEY = 'eh-prefs';
  let prefsReady = false;
  function loadPrefs(){
    try{ return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; }catch(e){ return {}; }
  }
  function savePrefs(){
    if(!prefsReady) return;
    const theme = THEMES.find(t => document.body.classList.contains('theme-' + t)) || null;
    const fx = Object.keys(FX_LINES).filter(f => document.documentElement.classList.contains('fx-' + f));
    try{ localStorage.setItem(PREFS_KEY, JSON.stringify({ theme, fx, ts: textScale, cols: galleryCols,
      order: photoOrder, info: showPhotoInfo, speed: slideSpeed })); }catch(e){}
  }
  function restorePrefs(){
    const P = loadPrefs();
    if(P.ts && TS_STEPS.indexOf(P.ts) >= 0) setTextScale(P.ts, true);
    if(P.cols && [1, 2, 3, 4].indexOf(P.cols) >= 0) setCols(P.cols, true);
    if(['shuffle', 'newest', 'oldest'].indexOf(P.order) >= 0) setPhotoOrder(P.order, true);
    if(P.info === false) setPhotoInfo(false, true);
    if(P.speed) setSlideSpeed(P.speed, true);
    if(!simpleMode){
      if(P.theme && THEMES.indexOf(P.theme) >= 0) applyTheme(P.theme, true);
      (P.fx || []).forEach(f => { if(FX_LINES[f]) toggleFx(f, true); });
    }
    prefsReady = true;
  }

  /* ---------- accessible format: plain, still, readable; remembered for return visits ---------- */
  const SIMPLE_KEY = 'eh-accessible';
  function setSimple(on, remember){
    simpleMode = !!on;
    if(simpleMode){
      resetLooks(true);
      closeAllFloatWins(false);
      floatPhysics = 'still';
    } else {
      floatPhysics = 'drift';
    }
    REDUCED_MOTION = simpleMode || OS_REDUCED_MOTION;
    document.documentElement.classList.toggle('a11y', simpleMode);
    if(remember){
      try{ localStorage.setItem(SIMPLE_KEY, simpleMode ? '1' : '0'); }catch(e){}
    }
    refreshSettings();
  }

  function openSettings(){
    settingsOpen = true;
    if(settingsEls && settingsEls.wrap.isConnected){
      applySettingsOpen();
      const r = settingsEls.wrap.getBoundingClientRect(), o = output.getBoundingClientRect();
      smoothScrollOutput(output.scrollTop + r.top - o.top - 12);
    } else {
      printRootListing();
    }
  }


  function runCommand(raw){
    const cmdLine = raw.trim();
    printEcho(cmdLine);
    if(!cmdLine) return;
    history.push(cmdLine);
    histIdx = history.length;

    const parts = cmdLine.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const arg = parts.slice(1).join(' ');

    switch(cmd){
      case 'help': case 'menu': case 'settings': openSettings(); break;
      case 'ls': doLs(arg); break;
      case 'cd': doCd(arg); break;
      case 'cat': case 'open': case 'less': case 'more': doCat(arg); break;
      case 'pwd': printLine(cwd ? '~/' + cwd : '~'); break;
      case 'contact': doCat('contact.txt'); break;
      case 'about': doCat('about.txt'); break;
      case 'work': doLs('work'); break;
      case 'journal': doLs('journal'); break;
      case 'geocity': case 'geocities': applyTheme('geocity'); break;
      case 'crt': applyTheme('crt'); break;
      case 'darkroom': applyTheme('darkroom'); break;
      case 'negative': case 'inverted': case 'invert': toggleFx('negative'); break;
      case 'grain': toggleFx('grain'); break;
      case 'gravity': case 'antigravity': case 'magnet': case 'zerog': setPhysics(cmd === 'zerog' ? 'drift' : cmd); break;
      case 'reset': case 'normal': resetLooks(); break;
      default:
        printLine("command not found: " + cmd + ". try ls, cat, cd or settings.", 'err');
    }
    focusInput();
  }

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const val = input.value;
      input.value = '';
      runCommand(val);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(histIdx > 0){ histIdx--; input.value = history[histIdx] || ''; }
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(histIdx < history.length){ histIdx++; input.value = history[histIdx] || ''; }
    }
  });

  document.addEventListener('mouseup', (e) => {
    if(e.target && e.target.closest && e.target.closest('input, textarea, select, a, .compose, .float-win')) return;
    const sel = window.getSelection();
    if(sel && sel.toString().length > 0) return;
    focusInput();
  });

  function scrambleInto(elm, delaySec, durSec){
    const finalText = elm.textContent;
    if(!finalText) return;
    const len = finalText.length;
    elm.textContent = '';
    const start = performance.now() + delaySec * 1000;
    const totalMs = Math.max(durSec * 1000, 1);
    const perCharMs = totalMs / len;
    const settleFrac = 0.55; // portion of each character's slot spent scrambling before it locks in
    function frame(now){
      if(now < start){ requestAnimationFrame(frame); return; }
      const elapsed = now - start;
      if(elapsed >= totalMs){ elm.textContent = finalText; return; }
      const settledCount = Math.floor(elapsed / perCharMs);
      let out = finalText.slice(0, settledCount);
      const ch = finalText[settledCount];
      if(ch !== undefined){
        if(ch === ' ' || ch === '\n'){
          out += ch;
        } else {
          const withinSlot = (elapsed - settledCount * perCharMs) / perCharMs;
          out += (withinSlot >= settleFrac) ? ch : SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
        }
      }
      elm.textContent = out;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function getScrambleTargets(elm){
    if(elm.classList.contains('line')) return [elm];
    if(elm.classList.contains('inputrow')){
      const s = elm.querySelector('.promptlabel');
      return s ? [s] : [];
    }
    const spans = Array.from(elm.querySelectorAll('span')).filter(s => !s.querySelector('span'));
    return spans.length ? spans : [elm];
  }

  function decodeInRows(box, stepSec, durSec){
    if(REDUCED_MOTION) return;
    Array.from(box.children).forEach((row, i) => {
      const delay = i * stepSec;
      row.style.animationDelay = delay.toFixed(2) + 's';
      row.style.animationDuration = durSec.toFixed(2) + 's';
      row.classList.add('boot-flicker');
      getScrambleTargets(row).forEach(t => scrambleInto(t, delay, durSec));
    });
  }

  function flickerElement(elm){
    if(REDUCED_MOTION) return;
    const delay = Math.random() * 0.6;
    const dur = 1.3 + Math.random() * 0.9;
    elm.style.animationDelay = delay.toFixed(2) + 's';
    elm.style.animationDuration = dur.toFixed(2) + 's';
    elm.classList.add('boot-flicker');
    getScrambleTargets(elm).forEach(t => scrambleInto(t, delay, dur));
  }

  function runBootFlicker(){
    const targets = [];
    const topbar = document.querySelector('.topbar');
    if(topbar) targets.push(topbar);
    const intro = document.querySelector('.boot-intro');
    if(intro) intro.querySelectorAll('.line').forEach(l => targets.push(l));
    if(rootPanelBody){
      const panel = rootPanelBody.closest('.panel');
      if(panel){
        const head = panel.querySelector('.panelhead');
        if(head) targets.push(head);
      }
      rootPanelBody.querySelectorAll('.listing > div').forEach(row => targets.push(row));
    }
    const inputRow = document.querySelector('.inputrow');
    if(inputRow) targets.push(inputRow);
    targets.forEach(flickerElement);
  }

  function boot(){
    const intro = el('div', 'entry boot-intro');
    const introRow = el('div', 'boot-intro-row');
    const textCol = el('div', 'boot-intro-text');
    textCol.appendChild(el('div', 'line dim', esc('connected to elijahhalford.tty — session started')));
    textCol.appendChild(el('div', 'line dim', esc(isNarrow()
      ? "video & photo, orlando."
      : "video & photo, orlando.")));
    introRow.appendChild(textCol);
    const logo = document.createElement('img');
    logo.className = 'boot-logo';
    logo.src = LOGO_GIF_DATA_URI;
    logo.alt = '';
    logo.draggable = false;
    logo.addEventListener('contextmenu', denySaveSilent);
    introRow.appendChild(logo);
    intro.appendChild(introRow);
    output.appendChild(intro);
    printRootListing();
    focusInput();
    runBootFlicker();
  }

  const onLayoutChange = () => updatePrompt();
  if(MQ_NARROW.addEventListener) MQ_NARROW.addEventListener('change', onLayoutChange);
  else if(MQ_NARROW.addListener) MQ_NARROW.addListener(onLayoutChange);

  // once the page is up, quietly fetch the about gif so it appears instantly
  function warmSiteImages(){
    const i = new Image(); i.src = ABOUT_GIF_DATA_URI;
  }
  window.addEventListener('load', () => {
    if('requestIdleCallback' in window) requestIdleCallback(warmSiteImages, { timeout: 4000 });
    else setTimeout(warmSiteImages, 2000);
  });

  function startup(){
    let savedSimple = null;
    try{ savedSimple = localStorage.getItem(SIMPLE_KEY); }catch(e){}
    if(savedSimple === '1') setSimple(true, false);
    restorePrefs();
    updatePrompt();
    if(location.hash === '#ended'){
      try{ history.replaceState(null, '', location.pathname + location.search); }
      catch(e){ location.hash = ''; }
    }
    boot();
  }
  startup();
})();
</script>
